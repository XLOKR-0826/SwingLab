<script>
// 스윙 분석: 업로드 → 자동 분석 → 플레이어 + 템포
(function (SL) {
  const progressOverlay = (title) => {
    const o = SL.h(`<div class="overlay"><div class="box"><div class="spinner"></div>
      <div style="margin-top:18px;font-weight:700;font-size:17px" class="ot">${title}</div>
      <div class="bar"><i></i></div><div class="small muted op">준비 중…</div></div></div>`);
    document.body.appendChild(o);
    return {
      set(p, msg) { SL.$('.bar i', o).style.width = Math.round(p * 100) + '%'; if (msg) SL.$('.op', o).textContent = msg; },
      close() { o.remove(); },
    };
  };

  // 레코드 분석 실행 (업로드 직후 / 연습모드 클립 재분석 공용)
  SL.runAnalysis = async (rec) => {
    const ov = progressOverlay('스윙을 분석하고 있어요');
    const v = document.createElement('video');
    v.style.cssText = 'position:fixed;left:-9999px;width:2px;height:2px'; document.body.appendChild(v);
    const url = URL.createObjectURL(rec.blob);
    try {
      await SL.loadVideo(v, url);
      if (v.duration > 15) SL.toast('앞 15초까지만 분석해요. 스윙 구간만 잘라서 올리면 더 정확해요', 3500);
      ov.set(0.02, 'AI 자세 인식 모델 불러오는 중…');
      await SL.pose.get('full');
      await SL.analyzer.analyzeRecord(rec, v, p => ov.set(0.05 + p * 0.9, `프레임 분석 ${Math.round(p * 100)}%`));
      ov.set(0.97, '진단 정리 중…');
      const tt = rec.phases ? rec.phases.t.top : v.duration / 2;
      await SL.seek(v, tt); rec.thumb = SL.thumbOf(v) || rec.thumb;
      if (!rec.phases) SL.toast('스윙 구간을 찾지 못했어요 — 전신이 보이게 다시 촬영해 보세요', 3500);
    } catch (e) {
      console.error(e);
      if (!rec.thumb) { try { await SL.seek(v, Math.min(1, v.duration / 2)); rec.thumb = SL.thumbOf(v); } catch (_) {} }
      SL.toast('AI 모델을 불러오지 못했어요(인터넷 확인). 영상은 저장됐어요', 3500);
    } finally {
      await SL.db.put(rec);
      ov.close(); URL.revokeObjectURL(url); v.remove();
    }
    return rec;
  };

  function uploadView(view) {
    const st = { view: 'side', club: '드라이버', slow: 1 };
    view.innerHTML = `${SL.pageHead('스윙 업로드')}
      <label class="drop" for="file">${SL.icon('upload')}<b>스윙 영상 선택</b>
        <div class="small muted" style="margin-top:6px">어드레스~피니시가 담긴 3~10초 영상이 가장 좋아요</div></label>
      <input id="file" type="file" accept="video/*" hidden>
      <div class="field"><label class="lb">촬영 방향</label>
        <div class="seg" id="view"><button data-v="side" class="on">측면 (후방, DTL)</button><button data-v="front">정면 (Face-on)</button></div></div>
      <div class="field"><label class="lb">클럽</label><div class="chips" id="club">${SL.CLUBS.map((c, i) => `<button class="chip ${i ? '' : 'on'}" data-c="${c}">${c}</button>`).join('')}</div></div>
      <div class="field"><label class="lb">영상 종류 (템포 계산 보정)</label>
        <div class="seg" id="slow"><button data-s="1" class="on">일반 속도</button><button data-s="4">슬로모 120fps</button><button data-s="8">슬로모 240fps</button></div></div>
      <div class="card" style="margin-top:20px">
        <div style="font-weight:700;margin-bottom:6px">촬영 팁</div>
        <div class="tip"><i>1</i>삼각대로 고정 — 카메라가 움직이면 궤적이 틀어져요</div>
        <div class="tip"><i>2</i>머리부터 발끝, 클럽 끝까지 화면 안에</div>
        <div class="tip"><i>3</i>측면은 손 높이, 타겟 라인 뒤에서 촬영</div>
      </div>
      <a class="btn ghost block" style="margin-top:12px" href="#/compare">${SL.icon('compare')}내 스윙 vs 프로 스윙 비교하기</a>`;
    const segBind = (id, key, attr, num) => SL.$('#' + id, view).addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      st[key] = num ? +b.dataset[attr] : b.dataset[attr];
      SL.$$('button', b.parentElement).forEach(x => x.classList.toggle('on', x === b));
    });
    segBind('view', 'view', 'v'); segBind('club', 'club', 'c'); segBind('slow', 'slow', 's', true);
    SL.$('#file', view).addEventListener('change', async (e) => {
      const f = e.target.files[0]; if (!f) return;
      const rec = { id: SL.uid(), createdAt: Date.now(), source: 'upload', title: f.name, blob: f, view: st.view, club: st.club, slow: st.slow, hand: SL.settings.hand };
      await SL.runAnalysis(rec);
      SL.go('analyze', { id: rec.id });
    });
  }

  SL.route('analyze', async (view, params) => {
    if (!params.id) { uploadView(view); return; }
    const rec = await SL.db.get(params.id);
    if (!rec) { view.innerHTML = SL.pageHead('스윙분석') + '<div class="empty">기록을 찾을 수 없어요</div>'; return; }
    const url = SL.blobUrl(rec);
    view.innerHTML = SL.pageHead('스윙분석', { right: `<button class="icon-btn" id="del">${SL.icon('trash')}</button>` });
    const player = new SL.SwingPlayer(view, rec, url);
    if (params.p && rec.phases) player.ready.then(() => player.jump(params.p));
    const t = rec.tempo, d = rec.diagnosis;
    const info = SL.h(`<div>
      <div class="row small muted" style="margin-top:16px;gap:6px;flex-wrap:wrap">
        <span class="badge">${SL.esc(rec.club || '-')}</span><span class="badge">${rec.view === 'front' ? '정면' : '측면'}</span>
        ${rec.source === 'practice' ? '<span class="badge">연습모드</span>' : ''}<span>${SL.fmtDate(rec.createdAt)}</span></div>
      ${t ? `<div class="metrics">
          <div class="metric hl"><span>스윙 템포</span><b>${t.ratio}<small>: 1</small></b></div>
          <div class="metric"><span>백스윙</span><b>${t.back}<small>s</small></b></div>
          <div class="metric"><span>다운스윙</span><b>${t.down}<small>s</small></b></div></div>
        <div class="tempo-bar"><i style="width:${t.back / (t.back + t.down) * 100}%;background:#40C8E0"></i><i style="width:${t.down / (t.back + t.down) * 100}%;background:#FF453A"></i></div>
        <div class="tiny muted" style="margin-top:6px">투어 프로 평균 약 3:1 (백스윙 0.7~0.9초 / 다운스윙 0.25~0.3초)${rec.slow > 1 ? ` · 슬로모 ×${rec.slow} 보정됨` : ''}</div>` : ''}
      ${d ? `<a class="ai-result" href="#/report?id=${rec.id}" style="margin-top:16px">
          <span class="ai-badge">AI</span><div style="flex:1"><b>${SL.esc(d.headline)}</b><p>${SL.esc(d.sub)} · 진단과 드릴 보기 ›</p></div></a>`
        : `<div class="card" style="margin-top:16px"><b>아직 분석하지 않은 영상이에요</b><p class="small muted" style="margin-top:4px">AI가 관절을 인식해 구간·템포·궤적을 계산해요</p>
           <button class="btn primary block" id="run" style="margin-top:12px">${SL.icon('ai')}정밀 분석 실행</button></div>`}
      <div class="grid2" style="margin-top:12px">
        <a class="btn" href="#/compare?a=${rec.id}">${SL.icon('compare')}비교하기</a>
        <a class="btn primary" href="#/report?id=${rec.id}" ${d ? '' : 'style="pointer-events:none;opacity:.4"'}>${SL.icon('drill')}AI 진단 & 드릴</a>
      </div></div>`);
    view.appendChild(info);
    const run = SL.$('#run', info);
    if (run) run.onclick = async () => { player.destroy(); await SL.runAnalysis(rec); SL.render(); };
    SL.$('#del', view).onclick = async () => {
      if (!confirm('이 스윙 기록을 삭제할까요?')) return;
      await SL.db.del(rec.id); SL.toast('삭제했어요'); SL.go('records');
    };
    return () => { player.destroy(); URL.revokeObjectURL(url); };
  });
})(window.SL);

</script>
<script>
// AI 분석 & 드릴 (진단 결과 → 원인 → 구간별 진단 → 추천 드릴 → 유튜브)
(function (SL) {
  const spark = `<svg class="spark" viewBox="0 0 120 80" fill="none"><path d="M5 70C30 60 50 30 115 8" stroke="#C6F432" stroke-width="2" stroke-dasharray="3 5"/><circle cx="115" cy="8" r="3" fill="#C6F432"/></svg>`;

  SL.route('report', async (view, params) => {
    let rec = params.id ? await SL.db.get(params.id) : null;
    if (!rec) rec = (await SL.db.all()).find(r => r.diagnosis);
    if (!rec || !rec.diagnosis) {
      view.innerHTML = `${SL.pageHead('AI 분석 & 드릴')}<div class="card empty">${SL.icon('ai')}분석된 스윙이 없어요<br>
        <a class="btn primary sm" style="margin-top:14px" href="#/analyze">스윙 영상 올리기</a></div>
        <h2 class="sec">미스샷으로 드릴 찾기</h2><div id="missOnly"></div>`;
      missPicker(SL.$('#missOnly', view), null, SL.settings.hand);
      return;
    }
    const d = rec.diagnosis;
    const userMiss = new Set(rec.userMiss || []);
    view.innerHTML = `${SL.pageHead('AI 분석 & 드릴')}
      <h2 class="sec" style="margin-top:6px"><span class="row">${SL.icon('ai').replace('<svg', '<svg width="18" height="18" style="color:#C6F432"')} AI 분석 결과</span>
        <span class="badge ${d.score >= 85 ? 'acc' : d.score >= 70 ? 'yel' : 'red'}">스윙 점수 ${d.score ?? '-'}</span></h2>
      <div class="ai-result"><span class="ai-badge">AI</span><div><b>${SL.esc(d.headline)}</b><p>${SL.esc(rec.club || '')} · ${rec.view === 'front' ? '정면' : '측면'} · ${SL.fmtDate(rec.createdAt)}</p></div>${spark}</div>

      <h2 class="sec">원인 분석</h2>
      <div class="card" style="padding:4px 16px">${d.issues.length ? d.issues.map(i => `
        <div class="cause"><span class="ci ${i.severity >= 2 ? 'bad' : 'warn'}">${SL.icon(i.severity >= 2 ? 'warn' : 'target')}</span>
          <div style="flex:1"><b>${SL.esc(i.title)}</b><p>${SL.esc(i.detail)}</p>
          <button class="badge" data-jump="${i.phase}" style="margin-top:6px">${SL.phaseName(i.phase)} 장면 보기 ›</button></div></div>`).join('')
        : `<div class="cause"><span class="ci">${SL.icon('check')}</span><div><b>뚜렷한 문제가 보이지 않아요</b><p>측정한 항목이 모두 기준 범위 안이에요.</p></div></div>`}</div>

      <h2 class="sec">구간별 진단</h2>
      <div class="card phase-list" style="padding:4px 16px">${SL.PHASES.map(p => {
        const n = d.notes[p.key] || { status: 'na', text: '-' };
        return `<div class="ph"><span class="dot ${n.status === 'good' ? '' : n.status}"></span><span class="n">${p.name}</span><span class="d">${SL.esc(n.text)}</span></div>`;
      }).join('')}</div>

      <h2 class="sec">평소 미스샷 <span class="tiny muted">선택하면 드릴에 반영돼요</span></h2>
      <div class="chips" id="miss">${Object.entries(SL.analyzer.MISS).map(([k, v]) => `<button class="chip outline ${userMiss.has(k) ? 'on' : ''}" data-m="${k}">${v}</button>`).join('')}</div>

      <h2 class="sec">추천 드릴</h2>
      <div id="drills"></div>
      <a class="btn light block" id="more" target="_blank" rel="noopener" style="margin-top:14px">${SL.icon('youtube')}관련 영상 더보기</a>
      <p class="tiny dim" style="margin-top:10px;text-align:center">관절 인식 기반 자동 진단으로, 촬영 각도·화질에 따라 결과가 달라질 수 있어요.</p>`;

    const renderDrills = () => {
      const list = SL.drills.recommend(d, [...userMiss]);
      SL.$('#drills', view).innerHTML = list.slice(0, 6).map(SL.drills.card).join('');
      SL.yt.enhance(SL.$('#drills', view));
      const kw = [...new Set([...(d.issues.slice(0, 2).map(i => (SL.drills.BY_ISSUE[i.id] || [])[0]?.q).filter(Boolean)), ...[...userMiss].map(m => `골프 ${SL.analyzer.MISS[m]} 교정`)])];
      SL.$('#more', view).href = SL.drills.yt(kw[0] || '골프 스윙 드릴');
    };
    renderDrills();
    SL.$('#miss', view).addEventListener('click', async e => {
      const b = e.target.closest('[data-m]'); if (!b) return;
      const m = b.dataset.m; userMiss.has(m) ? userMiss.delete(m) : userMiss.add(m);
      b.classList.toggle('on', userMiss.has(m));
      rec.userMiss = [...userMiss]; await SL.db.put(rec); renderDrills();
    });
    view.addEventListener('click', e => {
      const b = e.target.closest('[data-jump]'); if (!b) return;
      SL.go('analyze', { id: rec.id, p: b.dataset.jump });
    });
  });

  function missPicker(root, _d, hand) {
    const sel = new Set();
    root.innerHTML = `<div class="chips">${Object.entries(SL.analyzer.MISS).map(([k, v]) => `<button class="chip outline" data-m="${k}">${v}</button>`).join('')}</div><div class="list" style="margin-top:8px"></div>`;
    root.addEventListener('click', e => {
      const b = e.target.closest('[data-m]'); if (!b) return;
      sel.has(b.dataset.m) ? sel.delete(b.dataset.m) : sel.add(b.dataset.m); b.classList.toggle('on');
      SL.$('.list', root).innerHTML = sel.size ? SL.drills.recommend(null, [...sel]).map(SL.drills.card).join('') : '';
      SL.yt.enhance(root);
    });
  }

  // 드릴 라이브러리 (검색)
  SL.route('drills', (view) => {
    const all = SL.drills.all();
    view.innerHTML = `${SL.pageHead('드릴')}
      <div class="card row" style="padding:0 14px;height:48px">${SL.icon('search').replace('<svg', '<svg width="18" height="18" style="color:#9AA3AE"')}
        <input id="q" placeholder="슬라이스, 템포, 체중이동…" style="flex:1;background:none;border:0;outline:0;height:100%;font-size:15px"></div>
      <div id="list" style="margin-top:6px"></div>`;
    const draw = (q = '') => {
      const s = q.trim();
      const res = all.filter(d => !s || (d.title + d.desc + d.q + (SL.analyzer.MISS[d.cat] || '')).includes(s));
      SL.$('#list', view).innerHTML = res.length ? res.slice(0, 12).map(SL.drills.card).join('') : `<div class="empty">검색 결과가 없어요<br><a class="btn sm" style="margin-top:10px" target="_blank" href="${SL.drills.yt('골프 ' + s + ' 드릴')}">유튜브에서 "${SL.esc(s)}" 찾기</a></div>`;
    };
    let tm; SL.$('#q', view).addEventListener('input', e => { draw(e.target.value); clearTimeout(tm); tm = setTimeout(() => SL.yt.enhance(SL.$('#list', view)), 600); });
    draw(); SL.yt.enhance(SL.$('#list', view));
  });
})(window.SL);

</script>
<script>
// 스윙 비교: 나란히 / 겹쳐보기, 각각 재생·정지·배속, 구간 맞추기, 한 화면에 그리기
(function (SL) {
  SL.route('compare', async (view, params) => {
    const slots = { a: null, b: null }; // {rec, url}
    view.innerHTML = `${SL.pageHead('스윙 비교')}
      <div class="seg" id="mode" style="margin-bottom:12px"><button data-m="side" class="on">나란히 보기</button><button data-m="overlay">겹쳐 보기</button></div>
      <div class="cmp-area"><div class="cmp-grid">
        <div class="cmp-slot" data-k="a"></div><div class="cmp-slot" data-k="b"></div>
      </div><canvas class="draw"></canvas></div>
      <div id="opRow" class="row" style="margin-top:10px;display:none"><span class="small muted" style="width:70px">B 투명도</span><input type="range" id="op" min="10" max="90" value="50" style="flex:1"></div>
      <div class="cmp-ctrls"><div class="cmp-ctrl" data-k="a"></div><div class="cmp-ctrl" data-k="b"></div></div>
      <div class="row" style="margin-top:10px">
        <button class="btn sm" id="both" style="flex:1">${SL.icon('play')}동시 재생</button>
        <button class="btn sm" id="sync" style="flex:1">처음으로</button>
      </div>
      <div class="small muted" style="margin:14px 0 6px">구간 맞추기 (두 영상 모두 분석된 경우)</div>
      <div class="chips" id="align">${SL.JUMP_PHASES.map(k => `<button class="chip" data-p="${k}">${SL.phaseName(k)}</button>`).join('')}</div>
      <div id="tools"></div>`;
    const area = SL.$('.cmp-area', view), grid = SL.$('.cmp-grid', view);
    const layer = new SL.DrawLayer(SL.$('canvas.draw', area));
    SL.drawToolbar(layer, SL.$('#tools', view));
    const urls = [];

    const label = (k, rec) => `${k.toUpperCase()} · ${rec.source === 'pro' ? '프로' : '나'}${rec.club ? ' ' + rec.club : ''}`;
    const renderSlot = (k) => {
      const box = SL.$(`.cmp-slot[data-k=${k}]`, view), ctrl = SL.$(`.cmp-ctrl[data-k=${k}]`, view), s = slots[k];
      if (!s) {
        box.innerHTML = `<div class="pick"><span class="small muted">${k === 'a' ? '내 스윙' : '비교할 스윙 (프로 영상 등)'}</span>
          <button class="btn sm primary" data-pick="${k}">${SL.icon('plus')}영상 선택</button></div>`;
        ctrl.innerHTML = `<div class="small dim" style="text-align:center;padding:14px 0">${k.toUpperCase()} 영상 없음</div>`;
        return;
      }
      box.innerHTML = `<span class="lab">${SL.esc(label(k, s.rec))}</span><video class="${k}" loop muted playsinline webkit-playsinline preload="auto"></video>`;
      const v = SL.$('video', box); s.v = v;
      SL.loadVideo(v, s.url).then(() => { v.playbackRate = s.speed || 0.5; }).catch(e => SL.toast(e.message));
      ctrl.innerHTML = `<div class="r"><button class="tbtn" data-act="play">${SL.icon('play')}</button>
          <button class="tbtn" data-act="prev">${SL.icon('prev')}</button><button class="tbtn" data-act="next">${SL.icon('next')}</button>
          <button class="tbtn" data-pick="${k}" style="margin-left:auto">${SL.icon('flip')}</button></div>
        <input type="range" min="0" max="1000" value="0">
        <div class="mini-speeds">${[0.25, 0.5, 0.75, 1].map(x => `<button data-sp="${x}" class="${x === (s.speed || 0.5) ? 'on' : ''}">${x}x</button>`).join('')}</div>`;
      const rg = SL.$('input', ctrl);
      rg.addEventListener('input', () => { v.pause(); v.currentTime = rg.value / 1000 * (v.duration || 0); });
      v.addEventListener('timeupdate', () => { if (v.duration) rg.value = v.currentTime / v.duration * 1000; });
      v.addEventListener('play', () => SL.$('[data-act=play]', ctrl).innerHTML = SL.icon('pause'));
      v.addEventListener('pause', () => SL.$('[data-act=play]', ctrl).innerHTML = SL.icon('play'));
      ctrl.onclick = (e) => {
        const b = e.target.closest('button'); if (!b) return;
        if (b.dataset.act === 'play') v.paused ? v.play().catch(() => {}) : v.pause();
        if (b.dataset.act === 'prev' || b.dataset.act === 'next') { v.pause(); v.currentTime = SL.clamp(v.currentTime + (b.dataset.act === 'next' ? 1 : -1) / 30, 0, v.duration || 0); }
        if (b.dataset.sp) { s.speed = +b.dataset.sp; v.playbackRate = s.speed; SL.$$('[data-sp]', ctrl).forEach(x => x.classList.toggle('on', x === b)); }
      };
    };

    const setSlot = async (k, rec) => {
      const old = slots[k]; if (old) { old.v && old.v.pause(); }
      const url = URL.createObjectURL(rec.blob); urls.push(url);
      slots[k] = { rec, url, speed: 0.5 }; renderSlot(k);
    };

    const pick = async (k) => {
      const list = (await SL.db.all()).filter(r => r.blob);
      SL.sheet(`<h3>${k.toUpperCase()} 영상 선택</h3>
        <label class="btn primary block" for="pf">${SL.icon('upload')}새 영상 업로드 (프로 스윙 등)</label>
        <input type="file" id="pf" accept="video/*" hidden>
        <div class="small muted" style="margin:16px 0 4px">저장된 스윙</div>
        ${list.length ? list.map(r => `<div class="rec" data-id="${r.id}" style="cursor:pointer">
          <div class="th ${r.thumb ? '' : 'ph'}" style="${r.thumb ? `background-image:url(${r.thumb})` : ''}">${r.thumb ? '' : SL.icon('club')}</div>
          <div class="meta"><b>${r.source === 'pro' ? '프로 · ' : ''}${SL.esc(r.club || r.title || '스윙')}</b><span>${SL.fmtDate(r.createdAt)}</span></div></div>`).join('') : '<div class="empty">저장된 영상이 없어요</div>'}`,
        (sh, close) => {
          sh.addEventListener('click', async e => {
            const r = e.target.closest('[data-id]'); if (!r) return;
            close(); setSlot(k, await SL.db.get(r.dataset.id));
          });
          SL.$('#pf', sh).addEventListener('change', async e => {
            const f = e.target.files[0]; if (!f) return; close();
            const rec = { id: SL.uid(), createdAt: Date.now(), source: k === 'b' ? 'pro' : 'upload', title: f.name, blob: f, club: '', view: 'side', hand: SL.settings.hand, slow: 1 };
            await SL.db.put(rec); setSlot(k, rec);
            SL.toast(k === 'b' ? '프로 영상으로 저장했어요 (기록 > 프로)' : '영상을 저장했어요');
          });
        });
    };

    view.addEventListener('click', e => { const b = e.target.closest('[data-pick]'); if (b) pick(b.dataset.pick); });
    SL.$('#mode', view).addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      SL.$$('#mode button', view).forEach(x => x.classList.toggle('on', x === b));
      const ov = b.dataset.m === 'overlay';
      grid.classList.toggle('overlay', ov); SL.$('#opRow', view).style.display = ov ? '' : 'none';
      const sb = SL.$('.cmp-slot[data-k=b]', view);
      sb.style.cssText = ov ? 'position:absolute;inset:0;background:transparent;height:auto' : '';
      if (ov) SL.toast('B 영상이 A 위에 겹쳐져요. 시작 프레임을 맞춘 뒤 재생하세요');
    });
    SL.$('#op', view).addEventListener('input', e => grid.style.setProperty('--op', e.target.value / 100));
    SL.$('#both', view).onclick = () => {
      const vs = ['a', 'b'].map(k => slots[k] && slots[k].v).filter(Boolean);
      const anyPlaying = vs.some(v => !v.paused);
      vs.forEach(v => anyPlaying ? v.pause() : v.play().catch(() => {}));
      SL.$('#both', view).innerHTML = (anyPlaying ? SL.icon('play') + '동시 재생' : SL.icon('pause') + '동시 정지');
    };
    SL.$('#sync', view).onclick = () => ['a', 'b'].forEach(k => { const s = slots[k]; if (s && s.v) { s.v.pause(); s.v.currentTime = 0; } });
    SL.$('#align', view).addEventListener('click', e => {
      const b = e.target.closest('[data-p]'); if (!b) return;
      let n = 0;
      ['a', 'b'].forEach(k => { const s = slots[k]; if (s && s.v && s.rec.phases) { s.v.pause(); s.v.currentTime = s.rec.phases.t[b.dataset.p] + 0.001; n++; } });
      if (n < 2) SL.toast('분석된 영상만 구간을 맞출 수 있어요 (영상 열기 → 정밀 분석)');
      SL.$$('#align .chip', view).forEach(x => x.classList.toggle('on', x === b));
    });

    renderSlot('a'); renderSlot('b');
    if (params.a) { const r = await SL.db.get(params.a); if (r) setSlot('a', r); }
    if (params.b) { const r = await SL.db.get(params.b); if (r) setSlot('b', r); }
    if (params.overlay) SL.$('#mode [data-m=overlay]', view).click();
    return () => { layer.destroy(); ['a', 'b'].forEach(k => slots[k] && slots[k].v && slots[k].v.pause()); urls.forEach(u => URL.revokeObjectURL(u)); };
  });
})(window.SL);

</script>
<script>
// 연습 모드: 카메라를 켜두면 스윙마다 자동으로 잘라 저장 → 스윙 일관성 분석
(function (SL) {
  const pickMime = () => {
    const c = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
    return c.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || '';
  };

  // 스윙 감지 상태머신 (시간 기반). 입력: 정규화 랜드마크, 현재시각(초)
  class SwingDetector {
    constructor(cb) { this.cb = cb; this.reset(); }
    reset() { this.state = 'wait'; this.since = null; this.prev = null; this.stillT = null; }
    update(lm, now) {
      if (!lm) return;
      const hy = (lm[15][1] + lm[16][1]) / 2, hx = (lm[15][0] + lm[16][0]) / 2;
      const shY = (lm[11][1] + lm[12][1]) / 2, hipY = (lm[23][1] + lm[24][1]) / 2;
      const T = Math.max(0.05, hipY - shY);
      let speed = 0;
      if (this.prev) { const dt = Math.max(0.016, now - this.prev.t); speed = Math.hypot(hx - this.prev.x, hy - this.prev.y) / T / dt; }
      this.prev = { x: hx, y: hy, t: now };
      const low = hy > hipY - 0.35 * T, still = speed < 0.7;
      switch (this.state) {
        case 'wait':
          if (low && still) { if (this.since == null) this.since = now; if (now - this.since > 0.5) { this.state = 'address'; this.addrT = now; this.stillT = now; this.cb('address'); } }
          else this.since = null;
          break;
        case 'address':
          if (still && low) { this.stillT = now; this.addrY = hy; }
          if (hy < shY) { this.state = 'back'; this.topY = hy; this.topT = now; this.lowY = null; this.cb('back'); }
          else if (!low && now - this.stillT > 3) { this.reset(); this.cb('wait'); }
          break;
        case 'back':
          if (this.lowY == null && hy < this.topY) { this.topY = hy; this.topT = now; this.cb('top'); }
          // 손이 골반 높이까지 내려오면 가장 낮은 지점(=임팩트)을 추적
          if (hy > hipY - 0.15 * T && now - this.topT > 0.08) {
            if (this.lowY == null || hy > this.lowY) { this.lowY = hy; this.lowT = now; }
            const addr = this.addrY ?? hipY;
            if (hy >= addr - 0.05 * T || hy < this.lowY - 0.05 * T) { this.state = 'follow'; this.impT = this.lowT; this.cb('impact'); }
          }
          if (this.state === 'back' && now - this.topT > 3) { this.reset(); this.cb('wait'); }
          break;
        case 'follow':
          if (now - this.impT > 1.1) {
            const back = this.topT - this.stillT, down = this.impT - this.topT;
            this.cb('finish', { back, down, ratio: down > 0 ? back / down : null, topHeight: (shY - this.topY) / T, addrT: this.addrT, topT: this.topT, impT: this.impT });
            this.state = 'cool'; this.coolT = now;
          }
          break;
        case 'cool':
          if (now - this.coolT > 0.8) { this.reset(); this.cb('wait'); }
          break;
      }
    }
  }
  SL.SwingDetector = SwingDetector;

  SL.route('practice', async (view) => {
    document.body.classList.add('fullscreen');
    const sessionId = SL.uid(); let count = 0;
    view.innerHTML = `<div class="pm">
      <div class="pm-stage"><video autoplay muted playsinline webkit-playsinline></video><canvas></canvas><div class="pm-guide"></div>
        <div class="pm-top">
          <div class="row"><button class="pill" id="close">${SL.icon('x').replace('<svg', '<svg width="14" height="14"')}</button>
            <span class="pill" id="recpill"><i class="rd"></i>REC <span id="rt">00:00</span></span></div>
          <span class="pill">연습 모드</span></div>
        <div class="pm-status"><span class="pill busy" id="st">카메라 준비 중…</span></div>
      </div>
      <div class="pm-bottom">
        <div class="pm-count"><span>오늘 저장된 스윙 <b id="cnt">0</b>개</span><button class="badge acc" id="cons">일관성 분석 ›</button></div>
        <div class="pm-thumbs" id="thumbs"><div style="width:auto;border:0;background:none;color:#6B7480;font-size:12px;display:flex;align-items:center">스윙하면 여기에 자동 저장돼요</div></div>
        <div class="pm-ctrl">
          <a class="pm-side" href="#/records">${SL.icon('gallery')}</a>
          <button class="recbtn" id="recbtn"><i></i></button>
          <button class="pm-side" id="flip">${SL.icon('flip')}</button>
        </div>
      </div></div>`;
    const video = SL.$('video', view), cv = SL.$('canvas', view), ctx = cv.getContext('2d');
    const st = SL.$('#st', view);
    const setStatus = (txt, cls = '') => { st.className = 'pill ' + cls; st.innerHTML = txt; };
    let stream = null, facing = 'environment', lm = null, raf = 0, active = false, sessStart = 0, wake = null, alive = true;
    let recorder = null, recStart = 0, topThumb = null;
    const mime = pickMime();
    const thumbCv = document.createElement('canvas');

    const startCam = async () => {
      if (stream) stream.getTracks().forEach(t => t.stop());
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } }, audio: false });
      } catch (e) {
        setStatus('카메라를 쓸 수 없어요', 'swing');
        SL.sheet(`<h3>카메라 권한이 필요해요</h3><p class="small muted">브라우저 설정에서 카메라를 허용해 주세요. HTTPS 주소(또는 localhost)에서만 카메라가 켜져요.<br><br>오류: ${SL.esc(e.message)}</p>`);
        return false;
      }
      video.srcObject = stream;
      const mir = facing === 'user' ? 'scaleX(-1)' : '';
      video.style.transform = cv.style.transform = mir;
      await video.play().catch(() => {});
      return true;
    };

    const startRec = () => {
      if (!window.MediaRecorder || !stream) return;
      const chunks = [];
      try { recorder = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 4e6 } : undefined); } catch (e) { recorder = new MediaRecorder(stream); }
      recorder._chunks = chunks;
      recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
      recorder.start(200); recStart = performance.now() / 1000;
    };
    const stopRec = (onBlob) => {
      const r = recorder; recorder = null;
      if (!r || r.state === 'inactive') return;
      r.onstop = () => onBlob && onBlob(new Blob(r._chunks, { type: r.mimeType || mime || 'video/webm' }));
      try { r.stop(); } catch (e) {}
    };

    const saveSwing = (m) => {
      const thumb = topThumb, start = recStart;
      stopRec(async (blob) => {
        const rec = {
          id: SL.uid(), createdAt: Date.now(), source: 'practice', sessionId, blob, thumb, club: SL.settings.practiceClub || '',
          view: 'side', hand: SL.settings.hand, slow: 1,
          tempo: m.ratio ? { back: +m.back.toFixed(2), down: +m.down.toFixed(2), ratio: +m.ratio.toFixed(1) } : null,
          topHeight: +m.topHeight.toFixed(2), live: { top: +(m.topT - start).toFixed(2), impact: +(m.impT - start).toFixed(2) },
        };
        await SL.db.put(rec);
        count++; SL.$('#cnt', view).textContent = count;
        const th = SL.$('#thumbs', view);
        if (count === 1) th.innerHTML = '';
        const d = SL.h(`<div style="${thumb ? `background-image:url(${thumb})` : ''}" data-id="${rec.id}"><span>${rec.tempo ? rec.tempo.ratio + ':1' : '#' + count}</span></div>`);
        th.prepend(d);
      });
      startRec();
    };

    const det = new SwingDetector((ev, m) => {
      if (!active) return;
      if (ev === 'address') { setStatus(SL.icon('check').replace('<svg', '<svg width="14" height="14"') + '어드레스 감지 — 스윙하세요', ''); if (recorder) { stopRec(null); } startRec(); }
      if (ev === 'back') setStatus('스윙 중…', 'swing');
      if (ev === 'top') { try { thumbCv.width = 120; thumbCv.height = Math.round(120 * video.videoHeight / video.videoWidth); thumbCv.getContext('2d').drawImage(video, 0, 0, thumbCv.width, thumbCv.height); topThumb = thumbCv.toDataURL('image/jpeg', 0.7); } catch (e) {} }
      if (ev === 'finish') { saveSwing(m); setStatus(`저장됨 · 템포 ${m.ratio ? m.ratio.toFixed(1) : '-'}:1`, ''); }
      if (ev === 'wait') setStatus(SL.icon('check').replace('<svg', '<svg width="14" height="14"') + '스윙 감지 대기중', '');
    });

    const loop = () => {
      if (!alive) return;
      raf = requestAnimationFrame(loop);
      const W = cv.clientWidth, H = cv.clientHeight, dpr = window.devicePixelRatio || 1;
      if (cv.width !== Math.round(W * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
      ctx.clearRect(0, 0, cv.width, cv.height);
      if (active) SL.$('#rt', view).textContent = new Date((performance.now() / 1000 - sessStart) * 1000).toISOString().substr(14, 5);
      if (!lm || video.readyState < 2) return;
      let p = null;
      try { p = SL.pose.detect(lm, video); } catch (e) { return; }
      det.update(p, performance.now() / 1000);
      if (p) {
        const vw = video.videoWidth, vh = video.videoHeight, s = Math.max(cv.width / vw, cv.height / vh);
        const ox = (cv.width - vw * s) / 2, oy = (cv.height - vh * s) / 2;
        const mapped = p.map(q => [(q[0] * vw * s + ox) / cv.width, (q[1] * vh * s + oy) / cv.height, q[2]]);
        SL.SwingPlayer.skeleton(ctx, mapped, cv.width, cv.height, dpr);
      }
    };

    const setActive = (on) => {
      active = on; SL.$('#recbtn', view).classList.toggle('on', on); SL.$('#recpill', view).classList.toggle('rec', on);
      if (on) { sessStart = performance.now() / 1000; det.reset(); setStatus(SL.icon('check').replace('<svg', '<svg width="14" height="14"') + '스윙 감지 대기중', '');
        if (navigator.wakeLock) navigator.wakeLock.request('screen').then(w => wake = w).catch(() => {}); }
      else { stopRec(null); setStatus('일시정지됨 — 빨간 버튼으로 시작', 'busy'); wake && wake.release && wake.release(); }
    };

    SL.$('#recbtn', view).onclick = () => { if (!lm) return SL.toast('AI 모델을 불러오는 중이에요'); setActive(!active); };
    SL.$('#flip', view).onclick = async () => { facing = facing === 'user' ? 'environment' : 'user'; const was = active; if (was) setActive(false); await startCam(); };
    SL.$('#close', view).onclick = () => SL.go('home');
    SL.$('#cons', view).onclick = () => { if (!count) return SL.toast('스윙을 2개 이상 저장하면 분석할 수 있어요'); SL.go('session', { id: sessionId }); };
    SL.$('#thumbs', view).addEventListener('click', e => { const d = e.target.closest('[data-id]'); if (d) SL.go('analyze', { id: d.dataset.id }); });

    if (await startCam()) {
      setStatus('AI 자세 인식 모델 불러오는 중…', 'busy');
      try { lm = await SL.pose.get('lite'); if (alive) { setActive(true); loop(); } }
      catch (e) { setStatus('AI 모델을 불러오지 못했어요', 'swing'); }
    }

    return () => {
      alive = false; cancelAnimationFrame(raf); stopRec(null);
      if (stream) stream.getTracks().forEach(t => t.stop());
      wake && wake.release && wake.release();
      document.body.classList.remove('fullscreen');
    };
  });
})(window.SL);

</script>
<script>
// 기록 목록 + 연습 세션 일관성 분석
(function (SL) {
  SL.route('records', async (view) => {
    const all = await SL.db.all();
    let filter = 'all', selecting = false; const sel = [];
    view.innerHTML = `<header class="pagehead left" style="margin:0 0 8px"><h1 style="font-size:22px">기록</h1>
        <button class="btn sm" id="selBtn">${SL.icon('compare')}비교 선택</button></header>
      <div class="chips" id="flt">${[['all', '전체'], ['upload', '업로드'], ['practice', '연습모드'], ['pro', '프로']].map(([k, v], i) => `<button class="chip ${i ? '' : 'on'}" data-f="${k}">${v}</button>`).join('')}</div>
      <div id="list" style="margin-top:6px"></div>
      <div id="selBar" style="display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + var(--safe-b) + 12px);width:calc(100% - 36px);max-width:724px;z-index:40" class="row">
        <button class="btn primary" style="flex:1" id="goSide">나란히 비교</button><button class="btn light" style="flex:1" id="goOv">겹쳐 보기</button></div>`;
    const draw = () => {
      const list = all.filter(r => filter === 'all' || r.source === filter);
      if (!list.length) { SL.$('#list', view).innerHTML = `<div class="empty">${SL.icon('chart')}기록이 없어요<br><a class="btn primary sm" style="margin-top:12px" href="#/analyze">스윙 업로드</a></div>`; return; }
      // 날짜별 그룹
      let html = '', last = '';
      list.forEach(r => {
        const day = SL.fmtDate(r.createdAt).slice(0, 10);
        if (day !== last) { html += `<div class="small muted" style="margin:18px 0 2px;font-weight:600">${day}</div>`; last = day; }
        if (selecting) html += `<div class="row" data-sel="${r.id}" style="cursor:pointer"><span class="chk ${sel.includes(r.id) ? 'on' : ''}">${sel.includes(r.id) ? SL.icon('check') : ''}</span><div style="flex:1;pointer-events:none">${SL.recCard(r)}</div></div>`;
        else html += SL.recCard(r);
      });
      SL.$('#list', view).innerHTML = html;
      SL.$('#selBar', view).style.display = selecting && sel.length === 2 ? 'flex' : 'none';
    };
    SL.$('#flt', view).addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (!b) return; filter = b.dataset.f; SL.$$('#flt .chip', view).forEach(x => x.classList.toggle('on', x === b)); draw(); });
    SL.$('#selBtn', view).onclick = () => { selecting = !selecting; sel.length = 0; SL.$('#selBtn', view).innerHTML = selecting ? '취소' : SL.icon('compare') + '비교 선택'; if (selecting) SL.toast('비교할 영상 2개를 고르세요'); draw(); };
    SL.$('#list', view).addEventListener('click', e => {
      const r = e.target.closest('[data-sel]'); if (!r) return; e.preventDefault();
      const id = r.dataset.sel, i = sel.indexOf(id);
      if (i >= 0) sel.splice(i, 1); else { if (sel.length === 2) sel.shift(); sel.push(id); }
      draw();
    });
    SL.$('#goSide', view).onclick = () => SL.go('compare', { a: sel[0], b: sel[1] });
    SL.$('#goOv', view).onclick = () => SL.go('compare', { a: sel[0], b: sel[1], overlay: 1 });
    draw();
  });

  // 연습 세션 일관성
  SL.route('session', async (view, params) => {
    const swings = (await SL.db.all()).filter(r => r.sessionId === params.id).reverse();
    const c = SL.analyzer.consistency(swings);
    view.innerHTML = `${SL.pageHead('스윙 일관성 분석')}`;
    if (!c) { view.innerHTML += `<div class="empty">템포가 측정된 스윙이 2개 이상 필요해요<br><a class="btn primary sm" style="margin-top:12px" href="#/practice">연습모드 계속하기</a></div>`; return; }
    const col = c.score >= 80 ? '#C6F432' : c.score >= 60 ? '#FFD60A' : '#FF453A';
    const R = 48, L = 2 * Math.PI * R;
    const maxR = Math.max(...swings.filter(s => s.tempo).map(s => s.tempo.ratio), 4);
    view.innerHTML += `
      <div class="card row" style="gap:18px">
        <div class="score-ring"><svg viewBox="0 0 110 110" width="110" height="110"><circle cx="55" cy="55" r="${R}" stroke="#22272E" stroke-width="10" fill="none"/>
          <circle cx="55" cy="55" r="${R}" stroke="${col}" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${L * c.score / 100} ${L}" transform="rotate(-90 55 55)"/></svg><b>${c.score}</b></div>
        <div><div style="font-weight:700;font-size:16px">${c.score >= 80 ? '리듬이 아주 일정해요' : c.score >= 60 ? '대체로 일정하지만 편차가 있어요' : '스윙마다 리듬이 달라요'}</div>
          <div class="small muted" style="margin-top:4px">${c.n}개 스윙 · 평균 템포 ${c.ratio.mean.toFixed(1)}:1 (±${c.ratio.sd.toFixed(2)})</div></div>
      </div>
      <h2 class="sec">스윙별 템포</h2>
      <div class="card"><div class="bars">${swings.filter(s => s.tempo).map((s, i) => `<div style="height:${s.tempo.ratio / maxR * 100}%;${Math.abs(s.tempo.ratio - c.ratio.mean) > c.ratio.sd * 1.5 ? 'background:#FF9F0A' : ''}"><span>${s.tempo.ratio}</span><em>${i + 1}</em></div>`).join('')}</div><div style="height:16px"></div></div>
      <h2 class="sec">상세</h2>
      <div class="card"><table class="t"><tr><th></th><th>평균</th><th>편차(±)</th></tr>
        <tr><td>템포 비율</td><td>${c.ratio.mean.toFixed(2)} : 1</td><td>${c.ratio.sd.toFixed(2)}</td></tr>
        <tr><td>백스윙 시간</td><td>${c.back.mean.toFixed(2)}s</td><td>${c.back.sd.toFixed(2)}s</td></tr>
        <tr><td>다운스윙 시간</td><td>${c.down.mean.toFixed(2)}s</td><td>${c.down.sd.toFixed(2)}s</td></tr>
        ${c.top ? `<tr><td>탑 손 높이</td><td>${c.top.mean.toFixed(2)}</td><td>${c.top.sd.toFixed(2)}</td></tr>` : ''}
      </table><p class="tiny dim" style="margin-top:8px">탑 손 높이 = 어깨선 위로 올라간 손 높이 (몸통 길이 기준)</p></div>
      <h2 class="sec">스윙 겹쳐 보기 <span class="tiny muted">템포가 가장 다른 두 스윙</span></h2>
      <div id="pair"></div>
      <h2 class="sec">저장된 스윙</h2>${swings.map(SL.recCard).join('')}`;
    const t = swings.filter(s => s.tempo);
    const lo = t.reduce((a, b) => (a.tempo.ratio < b.tempo.ratio ? a : b)), hi = t.reduce((a, b) => (a.tempo.ratio > b.tempo.ratio ? a : b));
    SL.$('#pair', view).innerHTML = `<a class="btn light block" href="#/compare?a=${lo.id}&b=${hi.id}&overlay=1">${SL.icon('stack')}${lo.tempo.ratio}:1 vs ${hi.tempo.ratio}:1 겹쳐 보기</a>`;
  });
})(window.SL);

</script>
<script>
// 추후 기능 페이지(샷데이터·대회·스토어) + 더보기(설정)
(function (SL) {
  SL.route('shotdata', (view) => {
    const items = [['클럽 헤드스피드', '임팩트 직전 클럽헤드 이동 속도 추정 (고속 촬영 필요)'], ['스윙 템포', '백스윙:다운스윙 비율 — 현재 구현됨'], ['스윙 궤도', '인-아웃 / 아웃-인 경로 각도'], ['어택 앵글', '임팩트 직전 헤드의 상하 진입각'], ['구질 추정', '궤도 + 페이스 방향으로 페이드/드로우 예측'], ['볼 출발 방향', '임팩트 직후 공 이동 방향 (정면 촬영)']];
    view.innerHTML = `${SL.pageHead('샷 데이터')}
      <div class="soon-hero"><span class="tag">준비중</span><h2>휴대폰 카메라로 샷 데이터 측정</h2>
        <p>트랙맨·GC 같은 장비 없이, 슬로모션 영상에서 측정 가능한 항목부터 단계적으로 추가할 예정이에요.</p></div>
      <h2 class="sec">측정 예정 항목</h2>
      <div class="card" style="padding:4px 16px">${items.map(([a, b], i) => `<div class="cause"><span class="ci ${i === 1 ? '' : 'warn'}">${SL.icon(i === 1 ? 'check' : 'shot')}</span><div><b>${a}</b><p>${b}</p></div></div>`).join('')}</div>`;
  });

  SL.route('tour', (view) => {
    const tours = ['PGA', 'LPGA', 'KPGA', 'KLPGA'];
    view.innerHTML = `${SL.pageHead('대회')}
      <div class="seg" id="tours">${tours.map((t, i) => `<button class="${i ? '' : 'on'}" data-t="${t}">${t}</button>`).join('')}</div>
      <div class="soon-hero" style="margin-top:14px"><span class="tag">준비중</span><h2 id="tt">PGA 투어</h2><p>대회 일정 · 실시간 리더보드 · 선수 정보를 한곳에서 볼 수 있게 연동할 예정이에요.</p></div>
      <h2 class="sec">이번 주 대회</h2>
      <div class="card"><div class="skel" style="height:18px;width:60%"></div><div class="skel" style="height:12px;width:40%;margin-top:10px"></div></div>
      <h2 class="sec">리더보드</h2>
      <div class="card" style="padding:4px 16px">${[1, 2, 3, 4, 5].map(i => `<div class="lb-row"><b style="width:22px">${i}</b><div class="skel" style="height:14px;flex:1"></div><div class="skel" style="height:14px;width:40px"></div></div>`).join('')}</div>
      <h2 class="sec">선수 정보</h2>
      <div class="grid3">${[1, 2, 3].map(() => `<div class="card"><div class="skel" style="width:48px;height:48px;border-radius:50%;margin:0 auto"></div><div class="skel" style="height:12px;margin-top:10px"></div></div>`).join('')}</div>
      <p class="tiny dim" style="margin-top:14px;text-align:center">데이터 연동 전 화면 구성입니다.</p>`;
    SL.$('#tours', view).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; SL.$$('#tours button', view).forEach(x => x.classList.toggle('on', x === b)); SL.$('#tt', view).textContent = b.dataset.t + ' 투어'; });
  });

  SL.route('store', (view) => {
    const cats = [['shirt', '골프웨어'], ['club', '클럽'], ['ball', '볼'], ['bag', '골프백']];
    view.innerHTML = `${SL.pageHead('스토어')}
      <div class="quick" style="margin-top:0">${cats.map(([i, t]) => `<a href="javascript:void 0" data-c="${t}"><span class="qi">${SL.icon(i)}</span>${t}</a>`).join('')}</div>
      <div class="soon-hero" style="margin-top:18px"><span class="tag">준비중</span><h2>브랜드별 골프용품 모아보기</h2><p>내 스윙 진단 결과에 맞는 용품(예: 슬라이스 방지 드라이버)을 추천하는 기능으로 확장할 예정이에요.</p></div>
      <h2 class="sec" id="ct">추천 상품</h2>
      <div class="grid2">${[1, 2, 3, 4].map(() => `<div class="prod"><div class="pi skel" style="border-radius:0"></div><div class="pt"><div class="skel" style="height:12px;width:70%"></div><div class="skel" style="height:12px;width:40%;margin-top:8px"></div></div></div>`).join('')}</div>`;
    view.addEventListener('click', e => { const a = e.target.closest('[data-c]'); if (a) { SL.$('#ct', view).textContent = a.dataset.c; SL.toast(`${a.dataset.c} 상품은 준비 중이에요`); } });
  });

  SL.route('more', async (view) => {
    const s = SL.settings;
    view.innerHTML = `<header class="pagehead left" style="margin:0 0 8px"><h1 style="font-size:22px">MY</h1></header>
      <div class="card">
        <div class="list-row"><span>이름</span><input id="nm" value="${SL.esc(s.name)}" style="background:none;border:0;text-align:right;color:var(--sub);outline:0;width:50%"></div>
        <div class="list-row"><span>스윙 방향</span><div class="seg" id="hand" style="width:170px"><button data-h="right" class="${s.hand === 'right' ? 'on' : ''}">오른손</button><button data-h="left" class="${s.hand === 'left' ? 'on' : ''}">왼손</button></div></div>
        <div class="list-row"><span>분석 프레임</span><div class="seg" id="fps" style="width:170px"><button data-f="30" class="${s.analysisFps == 30 ? 'on' : ''}">30fps</button><button data-f="60" class="${s.analysisFps == 60 ? 'on' : ''}">60fps</button></div></div>
      </div>
      <p class="tiny dim" style="margin:8px 4px 0">60fps는 더 정밀하지만 분석 시간이 2배 걸려요.</p>
      <h2 class="sec">유튜브 연결</h2>
      <div class="card">
        <div class="small muted" style="margin-bottom:8px">YouTube Data API 키를 넣으면 추천 드릴에 실제 영상 썸네일·제목이 표시돼요. 키는 이 기기에만 저장돼요.</div>
        <input class="input" id="ytk" autocomplete="off" spellcheck="false" placeholder="AIza로 시작하는 키" value="${SL.esc(s.ytKey || '')}">
        <div class="grid2" style="margin-top:10px"><button class="btn sm" id="ytSave">저장</button><button class="btn sm primary" id="ytTest">연결 테스트</button></div>
        <div class="tiny muted" id="ytMsg" style="margin-top:8px"></div>
      </div>
      <div class="card" style="margin-top:14px">
        <a class="list-row" href="#/shotdata"><span>샷 데이터 (준비중)</span><span class="r">${SL.icon('chev').replace('<svg', '<svg width="16" height="16"')}</span></a>
        <button class="list-row" id="homePhoto" style="width:100%">
          <span>홈 사진 바꾸기</span><span class="r">${SL.icon('chev').replace('<svg', '<svg width="16" height="16"')}</span></button>
        <a class="list-row" href="#/tour"><span>대회 정보 (준비중)</span><span class="r">${SL.icon('chev').replace('<svg', '<svg width="16" height="16"')}</span></a>
        <a class="list-row" href="#/store"><span>스토어 (준비중)</span><span class="r">${SL.icon('chev').replace('<svg', '<svg width="16" height="16"')}</span></a>
        <a class="list-row" href="#/drills"><span>드릴 라이브러리</span><span class="r">${SL.icon('chev').replace('<svg', '<svg width="16" height="16"')}</span></a>
        <div class="list-row"><span>저장 공간</span><span class="r" id="usage">-</span></div>
        <button class="list-row" id="wipe" style="width:100%;color:var(--red)">모든 기록 삭제</button>
      </div>
      <p class="tiny dim" style="margin-top:16px;text-align:center">SwingLab v0.5 · 영상은 이 기기 브라우저에만 저장돼요</p>`;
    SL.$('#nm', view).addEventListener('change', e => { s.name = e.target.value.trim() || '사용자'; SL.saveSettings(); SL.toast('저장했어요'); });
    SL.$('#hand', view).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; s.hand = b.dataset.h; SL.saveSettings(); SL.$$('#hand button', view).forEach(x => x.classList.toggle('on', x === b)); });
    SL.$('#fps', view).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; s.analysisFps = +b.dataset.f; SL.saveSettings(); SL.$$('#fps button', view).forEach(x => x.classList.toggle('on', x === b)); });
    const ytSave = () => { s.ytKey = SL.$('#ytk', view).value.trim(); SL.saveSettings(); SL.yt.clearCache(); };
    SL.$('#ytSave', view).onclick = () => { ytSave(); SL.toast(s.ytKey ? '키를 저장했어요' : '키를 지웠어요'); };
    SL.$('#ytTest', view).onclick = async () => {
      ytSave(); const m = SL.$('#ytMsg', view);
      if (!s.ytKey) { m.textContent = '키를 먼저 입력해 주세요'; return; }
      m.textContent = '확인 중…';
      try { const v = await SL.yt.search('골프 스윙 드릴', { force: true }); m.textContent = v ? `연결 성공 — "${v.title}"` : '연결됐지만 결과가 없어요'; }
      catch (e) { m.textContent = '실패: ' + e.message; }
    };
    SL.$('#homePhoto', view).onclick = () => SL.editHomePhoto();
    SL.$('#wipe', view).onclick = async () => { if (confirm('저장된 모든 스윙 영상과 분석을 삭제할까요? 되돌릴 수 없어요.')) { await SL.db.clear(); SL.toast('모두 삭제했어요'); } };
    if (navigator.storage && navigator.storage.estimate) navigator.storage.estimate().then(e => SL.$('#usage', view).textContent = `${(e.usage / 1e6).toFixed(1)}MB 사용`).catch(() => {});
  });
})(window.SL);

</script>
<script>SL.start();</script>
<!-- /build:scripts -->
</body>
</html>
