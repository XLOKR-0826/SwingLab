<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0B0D10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SwingLab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23C6F432%22/%3E%3Cpath d=%22M6 22C12 18 17 10 27 8%22 stroke=%22%230B0D10%22 stroke-width=%223%22 fill=%22none%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#0B0D10; --bg2:#14171C; --card:#1A1E24; --card2:#22272E; --line:#2C323A;
  --text:#F5F7FA; --sub:#9AA3AE; --dim:#6B7480;
  --accent:#C6F432; --accent-ink:#0B0D10; --accent-soft:rgba(198,244,50,.14);
  --red:#FF453A; --blue:#0A84FF; --yellow:#FFD60A; --orange:#FF9F0A; --cyan:#40C8E0;
  --radius:18px; --tab-h:64px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);height:100%}
body{font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo",system-ui,sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;overscroll-behavior:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
svg{display:block}
#app{max-width:760px;margin:0 auto;min-height:100%;position:relative}
#view{padding:calc(var(--safe-t) + 8px) 18px calc(var(--tab-h) + var(--safe-b) + 24px);min-height:100vh}
body.fullscreen #view{padding:0}
body.fullscreen #tabbar{display:none}

/* tab bar */
#tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:760px;height:calc(var(--tab-h) + var(--safe-b));
  padding-bottom:var(--safe-b);display:flex;background:rgba(14,16,20,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line);z-index:50}
#tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dim);font-size:11px}
#tabbar a b{font-weight:500}
#tabbar a.on{color:var(--text)}
#tabbar a.on .ti svg{stroke:var(--accent)}
.ti svg{width:24px;height:24px}

/* headers */
.topbar{display:flex;align-items:center;justify-content:space-between;height:52px;margin-bottom:6px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;letter-spacing:.02em}
.logo-mark{width:30px;height:20px;border-radius:5px;background:var(--accent);display:grid;place-items:center}
.logo-mark svg{width:20px;height:14px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--text)}
.icon-btn:active{background:var(--card)}
.icon-btn svg{width:22px;height:22px}
.row{display:flex;align-items:center;gap:8px}
.pagehead{display:flex;align-items:center;gap:4px;height:52px;margin:0 -8px 8px}
.pagehead h1{font-size:18px;font-weight:700;flex:1;text-align:center;margin-right:40px}
.pagehead.left h1{text-align:left;margin-right:0}

h2.sec{font-size:17px;font-weight:700;margin:26px 0 12px;display:flex;align-items:center;justify-content:space-between}
h2.sec a,h2.sec button{font-size:13px;font-weight:500;color:var(--sub)}
.muted{color:var(--sub)} .dim{color:var(--dim)} .small{font-size:13px} .tiny{font-size:11px}
.card{background:var(--card);border-radius:var(--radius);padding:16px}
.card + .card{margin-top:10px}
.grid2>.card,.grid3>.card{margin-top:0}
.stack>*+*{margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 20px;border-radius:14px;
  background:var(--card2);font-weight:600;font-size:15px;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.light{background:#fff;color:#111}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.block{width:100%}
.btn.sm{height:36px;padding:0 14px;font-size:13px;border-radius:11px}
.btn svg{width:18px;height:18px}
.btn[disabled]{opacity:.4;pointer-events:none}
.chip{height:34px;padding:0 13px;border-radius:999px;background:var(--card2);font-size:13px;font-weight:600;color:var(--sub);
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid transparent}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.chip.outline.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px}
.seg button{flex:1;height:34px;border-radius:9px;font-size:13px;font-weight:600;color:var(--sub)}
.seg button.on{background:var(--card2);color:var(--text)}

/* home */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#1C2117 0%,#151A12 60%,#0F120D 100%);border-radius:22px;padding:20px;min-height:170px}
.hero .who{font-size:20px;font-weight:700;display:flex;align-items:center;gap:4px}
.hero .who svg{width:18px;height:18px;color:var(--sub)}
.hero .golfer{position:absolute;right:6px;bottom:0;width:150px;height:160px;opacity:.95}
.hero-stats{display:flex;gap:18px;margin-top:22px}
.hero-stats div b{display:block;font-size:22px;font-weight:800;color:var(--accent)}
.hero-stats div span{font-size:12px;color:var(--sub)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px;margin-top:20px}
.quick a{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;color:var(--sub)}
.quick .qi{width:58px;height:58px;border-radius:18px;background:var(--card);display:grid;place-items:center;color:var(--text)}
.quick .qi svg{width:26px;height:26px}
.quick .qi.hl{background:var(--accent);color:var(--accent-ink)}
.quick .qi.soon{opacity:.55}
.rec{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:16px;padding:12px;margin-top:10px}
.rec .th{width:58px;height:58px;border-radius:12px;background:#000 center/cover;flex:none;position:relative;overflow:hidden}
.rec .th.ph{display:grid;place-items:center;color:var(--dim)}
.rec .meta{flex:1;min-width:0}
.rec .meta b{display:block;font-size:15px}
.rec .meta span{font-size:12px;color:var(--sub)}
.rec .go{width:34px;height:34px;border-radius:50%;background:var(--card2);display:grid;place-items:center}
.rec .go svg{width:14px;height:14px}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:700;background:var(--card2);color:var(--sub)}
.badge.acc{background:var(--accent-soft);color:var(--accent)}
.badge.red{background:rgba(255,69,58,.15);color:var(--red)}
.badge.yel{background:rgba(255,214,10,.14);color:var(--yellow)}
.empty{text-align:center;padding:34px 16px;color:var(--sub);font-size:14px}
.empty svg{width:40px;height:40px;margin:0 auto 10px;color:var(--dim)}

/* upload */
.drop{border:1.5px dashed var(--line);border-radius:20px;padding:34px 18px;text-align:center;display:block;cursor:pointer}
.drop svg{width:42px;height:42px;margin:0 auto 10px;color:var(--accent)}
.drop b{font-size:16px}
.field{margin-top:16px}
.field label.lb{display:block;font-size:13px;color:var(--sub);margin-bottom:8px;font-weight:600}
.tip{display:flex;gap:10px;font-size:13px;color:var(--sub);margin-top:8px}
.tip i{font-style:normal;color:var(--accent)}

/* progress overlay */
.overlay{position:fixed;inset:0;background:rgba(5,6,8,.86);backdrop-filter:blur(6px);z-index:80;display:grid;place-items:center;padding:30px}
.overlay .box{width:100%;max-width:340px;text-align:center}
.bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;margin:18px 0 8px}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .2s}
.spinner{width:44px;height:44px;border-radius:50%;border:3px solid var(--card2);border-top-color:var(--accent);margin:0 auto;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* player */
.sp{margin:0 -18px}
.sp-stagewrap{background:#000;display:flex;justify-content:center;align-items:center;position:sticky;top:0;z-index:20;overflow:hidden}
.sp-stage{position:relative;touch-action:none}
.sp-stage video{width:100%;height:100%;display:block;object-fit:contain;background:#000}
.sp-stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sp-stage canvas.draw.active{pointer-events:auto;cursor:crosshair}
.sp-hud{position:absolute;left:10px;top:10px;display:flex;gap:6px;pointer-events:none}
.sp-hud span{background:rgba(0,0,0,.55);backdrop-filter:blur(6px);border-radius:8px;padding:3px 8px;font-size:12px;font-weight:600}
.legend{display:flex;gap:10px;font-size:11px;color:var(--sub);align-items:center}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}
.sp-ctrl{padding:12px 18px 0}
.sp-time{display:flex;align-items:center;gap:10px}
.sp-time input[type=range]{flex:1}
.sp-time .t{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;min-width:86px;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;height:28px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:var(--card2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;margin-top:-7px}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--card2)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:0}
.sp-main{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.transport{display:flex;align-items:center;gap:6px}
.tbtn{width:44px;height:44px;border-radius:14px;background:var(--card);display:grid;place-items:center}
.tbtn svg{width:20px;height:20px}
.tbtn.play{width:54px;height:54px;border-radius:50%;background:#fff;color:#000}
.tbtn.play svg{width:22px;height:22px}
.tbtn.on{background:var(--accent);color:var(--accent-ink)}
.speeds{display:flex;gap:4px;background:var(--card);border-radius:12px;padding:3px}
.speeds button{height:34px;min-width:46px;border-radius:9px;font-size:12px;font-weight:700;color:var(--sub)}
.speeds button.on{background:#fff;color:#000}
.phases{display:flex;gap:6px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.phases::-webkit-scrollbar{display:none}
.phases button{flex:1;min-width:66px;height:52px;border-radius:12px;background:var(--card);font-size:12px;font-weight:600;color:var(--sub);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.phases button small{font-size:10px;color:var(--dim);font-weight:500}
.phases button.on{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.phases button:disabled{opacity:.35}
.toolrow{display:flex;align-items:center;gap:6px;margin-top:12px;flex-wrap:wrap}
.tool{height:38px;padding:0 11px;border-radius:11px;background:var(--card);display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--sub)}
.tool svg{width:17px;height:17px}
.tool.on{background:#fff;color:#000}
.tool.acc.on{background:var(--accent);color:var(--accent-ink)}
.palette{display:inline-flex;gap:6px;align-items:center;background:var(--card);border-radius:11px;padding:0 9px;height:38px}
.palette button{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.15)}
.palette button.on{outline:2px solid #fff;outline-offset:2px}
.vsep{width:1px;height:22px;background:var(--line);margin:0 2px}

/* metrics */
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.metric{background:var(--card);border-radius:16px;padding:13px}
.metric span{font-size:11px;color:var(--sub);display:block}
.metric b{font-size:22px;font-weight:800;letter-spacing:-.02em}
.metric b small{font-size:12px;font-weight:600;color:var(--sub);margin-left:2px}
.metric.hl b{color:var(--accent)}
.tempo-bar{display:flex;height:10px;border-radius:99px;overflow:hidden;margin-top:12px;background:var(--card2)}
.tempo-bar i{display:block;height:100%}

/* report (AI 분석 & 드릴) */
.ai-result{background:var(--card);border-radius:20px;padding:16px;display:flex;gap:12px;align-items:flex-start;position:relative;overflow:hidden}
.ai-badge{flex:none;width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:13px}
.ai-result b{font-size:16px;display:block;line-height:1.35}
.ai-result p{font-size:13px;color:var(--sub);margin-top:4px}
.ai-result .spark{position:absolute;right:-10px;top:-10px;width:120px;height:80px;opacity:.6}
.cause{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.cause:last-child{border-bottom:0}
.cause .ci{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.cause .ci svg{width:16px;height:16px}
.cause .ci.warn{background:rgba(255,159,10,.15);color:var(--orange)}
.cause .ci.bad{background:rgba(255,69,58,.15);color:var(--red)}
.cause b{font-size:14px;display:block}
.cause p{font-size:12.5px;color:var(--sub);margin-top:2px}
.phase-list .ph{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.phase-list .ph:last-child{border-bottom:0}
.phase-list .ph .n{width:76px;font-size:13px;font-weight:700;flex:none}
.phase-list .ph .d{flex:1;font-size:12.5px;color:var(--sub)}
.phase-list .ph .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--accent)}
.phase-list .ph .dot.warn{background:var(--orange)} .phase-list .ph .dot.bad{background:var(--red)} .phase-list .ph .dot.na{background:var(--dim)}
.drill{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:10px;margin-top:8px}
.drill .dt{width:96px;height:62px;border-radius:11px;flex:none;position:relative;overflow:hidden;display:grid;place-items:center}
.drill .dt svg{width:26px;height:26px;color:#fff;opacity:.95}
.drill .dt .len{position:absolute;right:5px;bottom:4px;font-size:10px;font-weight:700;background:rgba(0,0,0,.6);border-radius:4px;padding:1px 4px}
.drill .dm{flex:1;min-width:0}
.drill .dm b{font-size:14px;display:block}
.drill .dm span{font-size:12px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.drill .dm span.badge{display:inline-flex;overflow:visible}
.drill .chev{color:var(--dim)}
.drill .chev svg{width:16px;height:16px}

/* compare */
.cmp-area{position:relative;margin:0 -18px;background:#000}
.cmp-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.cmp-grid.overlay{grid-template-columns:1fr}
.cmp-slot{position:relative;background:#0a0a0a;aspect-ratio:9/16;max-height:66vh;overflow:hidden}
.cmp-grid.overlay .cmp-slot{aspect-ratio:auto;height:62vh}
.cmp-slot video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.cmp-grid.overlay .cmp-slot video.b{opacity:var(--op,.5)}
.cmp-slot .lab{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.6);padding:3px 8px;border-radius:7px;font-size:12px;font-weight:700;z-index:2}
.cmp-slot .pick{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;text-align:center}
.cmp-area canvas.draw{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.cmp-area canvas.draw.active{pointer-events:auto}
.cmp-ctrls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.cmp-ctrl{background:var(--card);border-radius:14px;padding:10px}
.cmp-ctrl .r{display:flex;align-items:center;gap:6px}
.cmp-ctrl input[type=range]{width:100%}
.mini-speeds{display:flex;gap:3px;margin-top:6px}
.mini-speeds button{flex:1;height:28px;border-radius:8px;font-size:11px;font-weight:700;background:var(--card2);color:var(--sub)}
.mini-speeds button.on{background:#fff;color:#000}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg2);width:100%;max-width:760px;border-radius:22px 22px 0 0;padding:10px 18px calc(18px + var(--safe-b));max-height:80vh;overflow:auto}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-size:17px;margin-bottom:10px}

/* practice (camera) */
.pm{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
.pm-stage{position:relative;flex:1;overflow:hidden}
.pm-stage video,.pm-stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pm-top{position:absolute;top:calc(var(--safe-t) + 10px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;z-index:3}
.pill{height:30px;padding:0 11px;border-radius:99px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700}
.pill .rd{width:8px;height:8px;border-radius:50%;background:var(--red)}
.pill.rec .rd{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.pm-status{position:absolute;top:calc(var(--safe-t) + 52px);left:50%;transform:translateX(-50%);z-index:3}
.pm-status .pill{background:rgba(198,244,50,.92);color:#0B0D10;height:32px;font-size:13px}
.pm-status .pill.busy{background:rgba(255,214,10,.95)}
.pm-status .pill.swing{background:rgba(255,69,58,.95);color:#fff}
.pm-guide{position:absolute;left:18%;right:18%;top:22%;bottom:18%;border:1.5px dashed rgba(198,244,50,.45);border-radius:18px;z-index:2;pointer-events:none}
.pm-bottom{background:linear-gradient(to top,rgba(0,0,0,.95),rgba(0,0,0,.7));padding:10px 14px calc(14px + var(--safe-b));position:relative;z-index:3}
.pm-count{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub);margin-bottom:8px}
.pm-count b{color:#fff;font-size:15px}
.pm-thumbs{display:flex;gap:6px;overflow-x:auto;min-height:62px;scrollbar-width:none}
.pm-thumbs::-webkit-scrollbar{display:none}
.pm-thumbs div{width:50px;height:62px;flex:none;border-radius:9px;background:#222 center/cover;position:relative;border:1.5px solid rgba(255,255,255,.15)}
.pm-thumbs div span{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:10px;font-weight:700;text-shadow:0 1px 2px #000}
.pm-ctrl{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding:0 18px}
.recbtn{width:70px;height:70px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center}
.recbtn i{width:54px;height:54px;border-radius:50%;background:var(--red);transition:all .2s}
.recbtn.on i{width:28px;height:28px;border-radius:7px}
.pm-side{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center}
.pm-side svg{width:22px;height:22px}

/* consistency */
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:10px}
.bars div{flex:1;background:var(--accent);border-radius:6px 6px 2px 2px;position:relative;min-width:12px}
.bars div span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--sub);white-space:nowrap}
.bars div em{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--dim);font-style:normal}
.score-ring{width:110px;height:110px;position:relative;flex:none}
.score-ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:28px;font-weight:800}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{color:var(--sub);font-weight:600;text-align:left;padding:8px 4px;border-bottom:1px solid var(--line)}
table.t td{padding:9px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}

/* coming soon */
.soon-hero{background:var(--card);border-radius:22px;padding:22px;position:relative;overflow:hidden}
.soon-hero .tag{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:800;padding:4px 8px;border-radius:7px;margin-bottom:10px}
.soon-hero h2{font-size:20px}
.soon-hero p{color:var(--sub);font-size:13px;margin-top:6px}
.skel{background:linear-gradient(90deg,var(--card) 0%,var(--card2) 50%,var(--card) 100%);background-size:200% 100%;animation:sk 1.6s infinite;border-radius:10px}
@keyframes sk{to{background-position:-200% 0}}
.lb-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.lb-row:last-child{border-bottom:0}
.prod{background:var(--card);border-radius:16px;overflow:hidden}
.prod .pi{aspect-ratio:1;display:grid;place-items:center;color:var(--dim)}
.prod .pi svg{width:40px;height:40px}
.prod .pt{padding:10px 12px}
.list-row{display:flex;align-items:center;justify-content:space-between;padding:15px 0;border-bottom:1px solid var(--line);font-size:15px}
.list-row:last-child{border-bottom:0}
.list-row .r{color:var(--sub);font-size:13px;display:flex;align-items:center;gap:6px}

#toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + var(--safe-b) + 16px);transform:translate(-50%,20px);background:#fff;color:#111;
  padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:120;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.chk.on{background:var(--accent);border-color:var(--accent);color:#000}

@media (min-width:600px){ .sp,.cmp-area{margin:0;border-radius:18px;overflow:hidden} .sp-ctrl{padding:12px 0 0} }

  SL.render = async () => {

    SL.$$('#tabbar a').forEach(a => a.classList.toggle('on', a.dataset.tab === TAB_OF[name]));

  // ---------- 비디오 로딩 (MediaRecorder webm 길이=Infinity 버그 보정) ----------
  SL.loadVideo = (video, src) => new Promise((resolve, reject) => {
    video.playsInline = true; video.muted = true; video.preload = 'auto';
    video.setAttribute('playsinline', ''); video.setAttribute('webkit-playsinline', '');
    const fail = () => reject(new Error('영상을 불러올 수 없어요 (지원하지 않는 형식일 수 있어요)'));
    video.addEventListener('error', fail, { once: true });
    video.addEventListener('loadedmetadata', async () => {
      if (!isFinite(video.duration)) {
        await new Promise(r => {
          const done = () => { video.removeEventListener('durationchange', chk); r(); };
          const chk = () => { if (isFinite(video.duration)) done(); };
          video.addEventListener('durationchange', chk);
          video.currentTime = 1e7;
          setTimeout(done, 3000);
        });
        video.currentTime = 0;
      }
      resolve(video);
    }, { once: true });
    video.src = src;
    video.load();
  });

  SL.seek = (video, t) => new Promise(r => {
    let done = false;
    const fin = () => { if (done) return; done = true; video.removeEventListener('seeked', fin); r(); };
    video.addEventListener('seeked', fin);
    video.currentTime = t;
    setTimeout(fin, 2000);
  });

  // 비디오 프레임 → 썸네일 dataURL
  SL.thumbOf = (video, w = 240) => {
    try {
      const vw = video.videoWidth, vh = video.videoHeight; if (!vw) return null;
      const c = document.createElement('canvas'); c.width = w; c.height = Math.round(w * vh / vw);
      c.getContext('2d').drawImage(video, 0, 0, c.width, c.height);

  };

  SL.phaseName = (k) => (SL.PHASES.find(p => p.key === k) || {}).name || k;
})(window.SL);

<script>
// IndexedDB 저장소: 스윙 영상(blob) + 분석 결과
(function (SL) {
  const DB = 'swinglab', STORE = 'swings', VER = 1;
  let _db = null, memory = new Map(); // IndexedDB 불가 환경 대비 메모리 fallback

  function open() {
    if (_db) return Promise.resolve(_db);
    return new Promise((res) => {
      let req;
      try { req = indexedDB.open(DB, VER); } catch (e) { return res(null); }
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(STORE)) {
          const s = db.createObjectStore(STORE, { keyPath: 'id' });
          s.createIndex('createdAt', 'createdAt');
        }
      };
      req.onsuccess = () => { _db = req.result; res(_db); };
      req.onerror = () => res(null);
    });
  }
  const tx = async (mode, fn) => {
    const db = await open();
    if (!db) return fn(null);
    return new Promise((res, rej) => {
      const t = db.transaction(STORE, mode), s = t.objectStore(STORE);
      const r = fn(s);
      t.oncomplete = () => res(r && 'result' in r ? r.result : r);
      t.onerror = () => rej(t.error);
    });
  };

  SL.db = {
    async put(rec) {
      rec.updatedAt = Date.now();
      const db = await open();
      if (!db) { memory.set(rec.id, rec); return rec; }
      await tx('readwrite', s => s.put(rec));
      return rec;
    },
    async get(id) {
      const db = await open();
      if (!db) return memory.get(id) || null;
      return tx('readonly', s => s.get(id));
    },
    async all() {
      const db = await open();
      let list = db ? await tx('readonly', s => s.getAll()) : [...memory.values()];
      return (list || []).sort((a, b) => b.createdAt - a.createdAt);
    },
    async del(id) {
      const db = await open();
      if (!db) { memory.delete(id); return; }
      await tx('readwrite', s => s.delete(id));
    },
    async clear() {
      const db = await open();
      if (!db) { memory.clear(); return; }
      await tx('readwrite', s => s.clear());
    },
  };

  // 저장된 레코드에서 재생용 URL 생성 (페이지 떠날 때 revoke)
  SL.blobUrl = (rec) => rec && rec.blob ? URL.createObjectURL(rec.blob) : null;
})(window.SL);

</script>
<script>
// MediaPipe Pose Landmarker 래퍼 (CDN 동적 로드)
(function (SL) {
  const VER = '0.10.14';
  const LIB = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VER}/vision_bundle.mjs`;
  const WASM = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VER}/wasm`;
  const MODELS = {
    lite: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',
    full: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task',
  };
  const cache = {};
  let ts = 0; // VIDEO 모드는 타임스탬프가 계속 증가해야 함

  SL.pose = {
    // MediaPipe 랜드마크 번호
    L: { nose: 0, lSh: 11, rSh: 12, lEl: 13, rEl: 14, lWr: 15, rWr: 16, lHip: 23, rHip: 24, lKn: 25, rKn: 26, lAn: 27, rAn: 28, lHeel: 29, rHeel: 30, lToe: 31, rToe: 32 },
    EDGES: [[11, 12], [11, 13], [13, 15], [12, 14], [14, 16], [11, 23], [12, 24], [23, 24], [23, 25], [25, 27], [24, 26], [26, 28], [27, 31], [28, 32], [27, 29], [28, 30]],

    async get(kind = 'full') {
      if (cache[kind]) return cache[kind];
      cache[kind] = (async () => {
        const vision = await import(LIB);
        const files = await vision.FilesetResolver.forVisionTasks(WASM);
        const make = (delegate) => vision.PoseLandmarker.createFromOptions(files, {
          baseOptions: { modelAssetPath: MODELS[kind], delegate },
          runningMode: 'VIDEO', numPoses: 1,
          minPoseDetectionConfidence: 0.5, minPosePresenceConfidence: 0.5, minTrackingConfidence: 0.5,
        });
        try { return await make('GPU'); } catch (e) { console.warn('GPU 실패 → CPU', e); return make('CPU'); }
      })();
      try { return await cache[kind]; } catch (e) { cache[kind] = null; throw e; }
    },

    // 한 프레임 추론 → [[x,y,vis], ...] (정규화 좌표) 또는 null
    detect(lm, source) {
      ts += 34;
      const r = lm.detectForVideo(source, ts);
      const p = r && r.landmarks && r.landmarks[0];
      if (!p) return null;
      return p.map(q => [+q.x.toFixed(4), +q.y.toFixed(4), +(q.visibility ?? 1).toFixed(2)]);
    },
  };
})(window.SL);

</script>
<script>
// 스윙 분석: 프레임 추출 → 관절/클럽헤드 추정 → 구간 검출 → 템포 → 진단
(function (SL) {
  const A = {};
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2, Math.min(a[2] ?? 1, b[2] ?? 1)];
  const deg = (r) => r * 180 / Math.PI;
  const angleAt = (a, b, c) => { // b에서의 각도
    const v1 = [a[0] - b[0], a[1] - b[1]], v2 = [c[0] - b[0], c[1] - b[1]];
    const d = Math.hypot(...v1) * Math.hypot(...v2); if (!d) return null;
    return deg(Math.acos(SL.clamp((v1[0] * v2[0] + v1[1] * v2[1]) / d, -1, 1)));
  };
  const median = (arr) => { const s = arr.filter(v => v != null && isFinite(v)).sort((a, b) => a - b); return s.length ? s[s.length >> 1] : null; };
  A.util = { dist, mid, angleAt, median };

  // 정규화 좌표를 (x*가로세로비, y)로 바꿔 거리 계산을 등방성으로
  const P = (lm, k, ar) => lm && lm[k] ? [lm[k][0] * ar, lm[k][1], lm[k][2]] : null;
  const handsOf = (lm, ar) => lm ? mid(P(lm, 15, ar), P(lm, 16, ar)) : null;
  const torsoOf = (lm, ar) => lm ? dist(mid(P(lm, 11, ar), P(lm, 12, ar)), mid(P(lm, 23, ar), P(lm, 24, ar))) : null;
  A.handsOf = handsOf; A.torsoOf = torsoOf; A.P = P;

  // ---------------- 1. 프레임 추출 ----------------
  A.extract = async (video, { fps = 30, maxSec = 15, onProgress = () => {} } = {}) => {
    const lm = await SL.pose.get('full');
    const vw = video.videoWidth, vh = video.videoHeight, ar = vw / vh;
    const dur = Math.min(video.duration, maxSec);
    const n = Math.max(2, Math.floor(dur * fps));
    const W = 160, H = Math.round(160 / ar);
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d', { willReadFrequently: true });
    let prev = null; const frames = [];
    for (let i = 0; i < n; i++) {
      const t = i / fps;
      await SL.seek(video, Math.min(t + 0.001, video.duration - 0.01));
      ctx.drawImage(video, 0, 0, W, H);
      const d = ctx.getImageData(0, 0, W, H).data;
      const g = new Uint8Array(W * H);
      for (let p = 0, q = 0; p < g.length; p++, q += 4) g[p] = (d[q] * 77 + d[q + 1] * 150 + d[q + 2] * 29) >> 8;
      let pose = null;
      try { pose = SL.pose.detect(lm, video); } catch (e) { console.warn(e); }
      let club = null;
      if (prev && pose) {
        const mask = new Uint8Array(W * H);
        for (let p = 0; p < g.length; p++) mask[p] = Math.abs(g[p] - prev[p]) > 28 ? 1 : 0;
        club = A.estimateClub(pose, mask, W, H, ar);
      }
      prev = g;
      frames.push({ t: +t.toFixed(3), lm: pose, club });
      onProgress((i + 1) / n);
    }
    A.cleanClub(frames, ar);
    return { frames, fps, ar, width: vw, height: vh };
  };

  // 움직임(프레임 차분) 중 손에서 '클럽 길이' 범위 안의 가장 먼 점 = 클럽헤드 추정 (베타)
  A.estimateClub = (pose, mask, W, H, ar) => {
    const hands = handsOf(pose, ar), T = torsoOf(pose, ar);
    if (!hands || !T || T < 0.02) return null;
    const rMin = 0.9 * T, rMax = 2.8 * T;
    let best = null, bestD = 0;
    for (let y = 1; y < H - 1; y++) {
      for (let x = 1; x < W - 1; x++) {
        const p = y * W + x; if (!mask[p]) continue;
        const px = ((x + 0.5) / W) * ar, py = (y + 0.5) / H;
        const d = Math.hypot(px - hands[0], py - hands[1]);
        if (d < rMin || d > rMax || d <= bestD) continue;
        const sup = mask[p - 1] + mask[p + 1] + mask[p - W] + mask[p + W] + mask[p - W - 1] + mask[p - W + 1] + mask[p + W - 1] + mask[p + W + 1];
        if (sup < 3) continue;
        bestD = d; best = [(x + 0.5) / W, (y + 0.5) / H];
      }
    }
    return best ? [+best[0].toFixed(4), +best[1].toFixed(4)] : null;
  };

  // 튀는 점 제거 + 짧은 공백 보간
  A.cleanClub = (frames, ar) => {
    const T = median(frames.map(f => torsoOf(f.lm, ar))) || 0.2;
    const pts = frames.map(f => f.club ? [f.club[0] * ar, f.club[1]] : null);
    const out = pts.map((p, i) => {
      if (!p) return null;
      const win = []; for (let k = -3; k <= 3; k++) if (pts[i + k]) win.push(pts[i + k]);
      if (win.length < 3) return null;
      const m = [median(win.map(q => q[0])), median(win.map(q => q[1]))];
      return dist(p, m) > 0.7 * T ? null : p;
    });
    for (let i = 0; i < out.length; i++) { // 3프레임 이하 공백 선형 보간
      if (out[i]) continue;
      let a = i - 1, b = i; while (b < out.length && !out[b]) b++;
      if (a >= 0 && out[a] && b < out.length && b - a - 1 <= 3) {
        for (let k = a + 1; k < b; k++) { const r = (k - a) / (b - a); out[k] = [out[a][0] + (out[b][0] - out[a][0]) * r, out[a][1] + (out[b][1] - out[a][1]) * r]; }
      }
      i = b - 1;
    }
    frames.forEach((f, i) => { f.club = out[i] ? [+(out[i][0] / ar).toFixed(4), +out[i][1].toFixed(4)] : null; });
  };

  // ---------------- 2. 구간(포지션) 검출 ----------------
  A.series = (frames, ar) => {
    let H = frames.map(f => handsOf(f.lm, ar));
    const valid = H.filter(Boolean).length;
    if (valid < Math.max(8, frames.length * 0.4)) return null;
    // 결측 보간
    for (let i = 0; i < H.length; i++) if (!H[i]) {
      let a = i - 1; while (a >= 0 && !H[a]) a--;
      let b = i + 1; while (b < H.length && !H[b]) b++;
      if (a < 0) H[i] = H[b]; else if (b >= H.length) H[i] = H[a];
      else { const r = (i - a) / (b - a); H[i] = [H[a][0] + (H[b][0] - H[a][0]) * r, H[a][1] + (H[b][1] - H[a][1]) * r, 0]; }
    }
    const S = H.map((_, i) => { // 3프레임 이동평균
      const w = [H[i - 1], H[i], H[i + 1]].filter(Boolean);
      return [w.reduce((s, p) => s + p[0], 0) / w.length, w.reduce((s, p) => s + p[1], 0) / w.length];
    });
    const T = median(frames.map(f => torsoOf(f.lm, ar))) || 0.2;
    const sp = S.map((p, i) => i ? dist(p, S[i - 1]) / T : 0);
    return { H: S, sp, T };
  };

  A.detectPhases = (frames, fps, ar) => {
    const s = A.series(frames, ar); if (!s) return null;
    const { H, sp } = s, n = H.length, y = H.map(p => p[1]);
    const thr = 0.02 * (30 / fps);
    const spS = sp.map((_, i) => (sp[Math.max(0, i - 1)] + sp[i] + sp[Math.min(n - 1, i + 1)]) / 3);
    let peak = 0; for (let i = 1; i < n; i++) if (spS[i] > spS[peak]) peak = i;
    const w = Math.max(2, Math.round(0.1 * fps));
    let impact = Math.max(1, peak - w);
    for (let i = Math.max(1, peak - w); i <= Math.min(n - 1, peak + w); i++) if (y[i] > y[impact]) impact = i;
    let top = 0; for (let i = 1; i < impact; i++) if (y[i] < y[top]) top = i;
    if (top >= impact - 1) return null;
    let start = top;
    const still = (i) => i >= 2 && spS[i] < thr && spS[i - 1] < thr && spS[i - 2] < thr;
    while (start > 0 && !still(start)) start--;
    const address = start;
    const travel = y[address] - y[top];
    if (travel < 0.4 * s.T) return null; // 백스윙으로 보기 어려움
    const first = (a, b, cond, def) => { for (let i = a; i <= b; i++) if (cond(i)) return i; return def; };
    const takeaway = first(address + 1, top, i => y[i] <= y[address] - 0.2 * travel, Math.round((address + top) / 2));
    const backswing = first(takeaway, top, i => y[i] <= y[address] - 0.65 * travel, Math.round((takeaway + top) / 2));
    const downswing = first(top + 1, impact, i => y[i] >= y[top] + 0.5 * (y[impact] - y[top]), Math.round((top + impact) / 2));
    const follow = first(impact + 1, n - 1, i => y[i] <= y[impact] - 0.6 * (y[impact] - y[top]), Math.min(n - 1, impact + Math.round(0.25 * fps)));
    let finish = first(follow + 2, n - 1, i => i + 2 < n && spS[i] < thr * 1.5 && spS[i + 1] < thr * 1.5 && spS[i + 2] < thr * 1.5, n - 1);
    const idx = { address, takeaway, backswing, top, downswing, impact, follow, finish };
    const t = {}; for (const k in idx) t[k] = +(idx[k] / fps).toFixed(3);
    return { idx, t, finishStable: finish < n - 1 };
  };

  A.tempo = (ph, fps, slow = 1) => {
    if (!ph) return null;
    const back = (ph.idx.top - ph.idx.address) / fps / slow;
    const down = (ph.idx.impact - ph.idx.top) / fps / slow;
    return { back: +back.toFixed(2), down: +down.toFixed(2), ratio: down > 0 ? +(back / down).toFixed(1) : null };
  };

  // ---------------- 3. 진단 (규칙 기반) ----------------
  const MISS_MSG = {
    slice: '우측으로 밀리는 슬라이스가 발생할 수 있어요',
    hook: '왼쪽으로 감기는 훅이 발생할 수 있어요',
    push: '공이 오른쪽으로 곧게 밀리는 푸시가 나올 수 있어요',
    pull: '왼쪽으로 당겨지는 풀 샷이 나올 수 있어요',
    fat: '뒷땅(두꺼운 샷)이 나올 수 있어요',
    thin: '탑볼(얇은 샷)이 나올 수 있어요',
    shank: '생크가 나올 수 있어요',
  };
  A.MISS = { slice: '슬라이스', hook: '훅', push: '푸시', pull: '풀', fat: '뒷땅', thin: '탑볼', shank: '생크' };
  A.missMessage = (k, hand = 'right') => {
    let m = MISS_MSG[k] || '';
    if (hand === 'left') m = m.replace('우측', '#L#').replace('오른쪽', '#R#').replace('왼쪽', '오른쪽').replace('#L#', '좌측').replace('#R#', '왼쪽');
    return m;
  };

  A.diagnose = (rec) => {
    const { frames, phases: ph, ar = 9 / 16, view = 'side', hand = 'right', tempo } = rec;
    const issues = [], notes = {};
    SL.PHASES.forEach(p => notes[p.key] = { status: 'good', text: '' });
    if (!ph) return { issues, notes, headline: '스윙 구간을 찾지 못했어요', sub: '전신이 다 보이도록 촬영하고, 어드레스부터 피니시까지 담아 주세요.', miss: null, measured: {} };
    const lead = hand === 'right' ? { sh: 11, el: 13, wr: 15, hip: 23, an: 27 } : { sh: 12, el: 14, wr: 16, hip: 24, an: 28 };
    const at = (key, k) => { // 해당 구간 ±1프레임 평균 좌표
      const i = ph.idx[key], pts = [];
      for (let d = -1; d <= 1; d++) { const f = frames[i + d]; if (f && f.lm && f.lm[k]) pts.push(P(f.lm, k, ar)); }
      if (!pts.length) return null;
      return [pts.reduce((s, p) => s + p[0], 0) / pts.length, pts.reduce((s, p) => s + p[1], 0) / pts.length, Math.min(...pts.map(p => p[2]))];
    };
    const hipMid = (key) => { const a = at(key, 23), b = at(key, 24); return a && b ? mid(a, b) : null; };
    const shMid = (key) => { const a = at(key, 11), b = at(key, 12); return a && b ? mid(a, b) : null; };
    const hands = (key) => { const a = at(key, 15), b = at(key, 16); return a && b ? mid(a, b) : null; };
    const T = torsoOf(frames[ph.idx.address].lm, ar) || median(frames.map(f => torsoOf(f.lm, ar))) || 0.2;
    const shW = (key) => { const a = at(key, 11), b = at(key, 12); return a && b ? dist(a, b) : null; };
    const measured = {};
    const add = (o) => {
      issues.push(o);
      const n = notes[o.phase]; const st = o.severity >= 2 ? 'bad' : 'warn';
      if (n.status === 'good' || (n.status === 'warn' && st === 'bad')) n.status = st;
      n.text = n.text ? n.text + ' · ' + o.short : o.short;
    };

    // 1) 머리(축) 움직임
    const n0 = at('address', 0), n1 = at('impact', 0);
    if (n0 && n1) {
      const d = dist(n0, n1) / T; measured.headMove = +d.toFixed(2);
      if (d > 0.3) add({ id: 'head_move', phase: 'impact', severity: d > 0.45 ? 2 : 1, short: '머리 이동 큼',
        title: '임팩트까지 머리(축)가 많이 움직여요', detail: `어드레스 대비 머리 이동량이 몸통 길이의 ${Math.round(d * 100)}%예요. 축이 흔들리면 컨택이 불안정해져요.`, miss: ['fat', 'thin'] });
    }
    // 2) 템포
    if (tempo && tempo.ratio) {
      measured.tempo = tempo.ratio;
      if (tempo.ratio < 2.2) add({ id: 'tempo_fast', phase: 'backswing', severity: 1, short: '백스윙 빠름',
        title: '백스윙 템포가 빨라요', detail: `백스윙:다운스윙 = ${tempo.ratio}:1 이에요. 투어 평균은 약 3:1이에요. 서두르면 전환이 급해져요.`, miss: ['slice', 'pull'] });
      else if (tempo.ratio > 4.2) add({ id: 'tempo_slow', phase: 'top', severity: 1, short: '전환 늘어짐',
        title: '백스윙이 느리거나 탑에서 멈춰요', detail: `템포 ${tempo.ratio}:1 — 탑에서 리듬이 끊기면 다운스윙에서 손으로 치기 쉬워요.`, miss: ['push', 'slice'] });
    }
    // 3) 탑에서 리드 팔
    const sh = at('top', lead.sh), el = at('top', lead.el), wr = at('top', lead.wr);
    if (sh && el && wr && Math.min(sh[2], el[2], wr[2]) > 0.4) {
      const a = angleAt(sh, el, wr); measured.leadArmTop = Math.round(a);
      if (a < 160) add({ id: 'lead_arm_bent', phase: 'top', severity: a < 145 ? 2 : 1, short: `왼팔 ${Math.round(a)}°`,
        title: '탑에서 리드 팔(왼팔)이 많이 굽어요', detail: `탑에서 왼팔 각도가 ${Math.round(a)}°예요. 스윙 아크가 작아지고 타점이 흔들릴 수 있어요.`, miss: ['slice', 'thin'] });
      else notes.top.text = `왼팔 ${Math.round(a)}° 유지`;
    }
    // 4) 임팩트 손 높이
    const h0 = hands('address'), h1 = hands('impact');
    if (h0 && h1) {
      const up = (h0[1] - h1[1]) / T; measured.handsUp = +up.toFixed(2);
      if (up > 0.2) add({ id: 'hands_high', phase: 'impact', severity: up > 0.32 ? 2 : 1, short: '손 들림',
        title: '임팩트 때 손이 어드레스보다 높아요', detail: '몸이 일어나면서 손이 들리면 페이스가 열리고 얇게 맞기 쉬워요.', miss: ['thin', 'slice'] });
    }

    if (view === 'side') {
      const f0 = frames[ph.idx.address].lm;
      let facing = 1;
      if (f0) { const dx = ((f0[31][0] - f0[29][0]) + (f0[32][0] - f0[30][0])); facing = dx >= 0 ? 1 : -1; }
      // 5) 얼리 익스텐션
      const p0 = hipMid('address'), p1 = hipMid('impact');
      if (p0 && p1) {
        const dx = (p1[0] - p0[0]) * facing / T; measured.hipToBall = +dx.toFixed(2);
        if (dx > 0.1) add({ id: 'early_ext', phase: 'impact', severity: dx > 0.18 ? 2 : 1, short: '배치기',
          title: '골반이 공 쪽으로 밀려요 (얼리 익스텐션)', detail: '다운스윙에서 골반이 앞으로 나오면 공간이 없어져 블록·훅·생크가 나올 수 있어요.', miss: ['push', 'shank', 'hook'] });
      }
      // 6) 척추각 유지
      const sp = (key) => { const s = shMid(key), h = hipMid(key); return s && h ? deg(Math.atan2(Math.abs(s[0] - h[0]), h[1] - s[1])) : null; };
      const a0 = sp('address'), a1 = sp('impact');
      if (a0 != null && a1 != null) {
        const ch = a0 - a1; measured.spineChange = Math.round(ch);
        if (ch > 8) add({ id: 'posture_loss', phase: 'downswing', severity: ch > 14 ? 2 : 1, short: `척추각 -${Math.round(ch)}°`,
          title: '다운스윙에서 상체가 일어나요', detail: `척추 기울기가 어드레스 ${Math.round(a0)}° → 임팩트 ${Math.round(a1)}°로 줄었어요.`, miss: ['thin', 'push'] });
        else notes.address.text = `척추 기울기 ${Math.round(a0)}°`;
      }
      // 7) 다운스윙 경로 (오버더탑 / 과한 인-아웃)
      const hd = hands('downswing');
      if (hd) {
        let best = null, bd = 9;
        for (let i = ph.idx.address; i <= ph.idx.top; i++) {
          const f = frames[i]; if (!f.lm) continue; const h = handsOf(f.lm, ar);
          const d = Math.abs(h[1] - hd[1]); if (d < bd) { bd = d; best = h; }
        }
        if (best) {
          const dx = (hd[0] - best[0]) * facing / T; measured.pathShift = +dx.toFixed(2);
          if (dx > 0.15) add({ id: 'over_top', phase: 'downswing', severity: dx > 0.28 ? 2 : 1, short: '아웃-인 궤도',
            title: '다운스윙이 바깥에서 들어와요 (오버 더 탑)', detail: '손이 백스윙 때보다 공 쪽(바깥)으로 내려와 아웃-인 궤도가 만들어져요.', miss: ['slice', 'pull'] });
          else if (dx < -0.3) add({ id: 'inside_out', phase: 'downswing', severity: 1, short: '과한 인-아웃',
            title: '다운스윙이 너무 안쪽에서 들어와요', detail: '인-아웃이 과하면 푸시나 훅이 나올 수 있어요.', miss: ['hook', 'push'] });
        }
      }
    } else {
      // 정면(Face-on)
      const sw0 = shW('address');
      // 8) 스웨이
      const p0 = hipMid('address'), pt = hipMid('top');
      if (p0 && pt && sw0) {
        const d = Math.abs(pt[0] - p0[0]) / sw0; measured.sway = +d.toFixed(2);
        if (d > 0.25) add({ id: 'sway', phase: 'backswing', severity: d > 0.4 ? 2 : 1, short: '스웨이',
          title: '백스윙 때 골반이 옆으로 밀려요 (스웨이)', detail: '회전 대신 옆으로 이동하면 다운스윙에서 되돌아오기 어려워 뒷땅·슬라이스가 생겨요.', miss: ['fat', 'slice'] });
      }
      // 9) 어깨 회전
      const swT = shW('top');
      if (sw0 && swT) {
        const r = swT / sw0; measured.shoulderTurn = +r.toFixed(2);
        if (r > 0.8) add({ id: 'short_turn', phase: 'top', severity: r > 0.9 ? 2 : 1, short: '회전 부족',

    const miss = Object.keys(score).sort((a, b) => score[b] - score[a])[0] || null;
    const headline = miss ? A.missMessage(miss, hand) : '큰 문제 없이 안정적인 스윙이에요';

        ctx.strokeStyle = s.color;
        ctx.shadowColor = s.color === '#000000' ? 'rgba(255,255,255,.5)' : 'rgba(0,0,0,.5)'; ctx.shadowBlur = 3 * dpr;
        ctx.beginPath();
        if (s.type === 'circle') ctx.arc(s.x * W, s.y * H, s.r * W, 0, Math.PI * 2);
        else { ctx.moveTo(s.x1 * W, s.y1 * H); ctx.lineTo(s.x2 * W, s.y2 * H); }
        ctx.stroke();
        // 편집 핸들
        if (this.tool) {
          ctx.shadowBlur = 0; ctx.fillStyle = '#fff';
          const hs = s.type === 'circle' ? [[s.x * W + s.r * W, s.y * H]] : [[s.x1 * W, s.y1 * H], [s.x2 * W, s.y2 * H]];
          hs.forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x, y, 4.5 * dpr, 0, 7); ctx.fill(); });
        }
      }
      ctx.shadowBlur = 0;
    }
  }

  // 툴바 HTML + 바인딩 (재생 화면/비교 화면 공용)
  SL.drawToolbar = (layer, root) => {
    const el = SL.h(`<div class="toolrow">
      <button class="tool" data-t="line">${SL.icon('line')}직선</button>
      <button class="tool" data-t="circle">${SL.icon('circle')}원</button>
      <div class="palette">${SL.COLORS.map((c, i) => `<button data-c="${c.v}" title="${c.name}" style="background:${c.v}" class="${i ? '' : 'on'}"></button>`).join('')}</div>
      <button class="tool" data-a="vis" title="그림 보이기/숨기기">${SL.icon('eye')}</button>
      <button class="tool" data-a="undo" title="되돌리기">${SL.icon('undo')}</button>
      <button class="tool" data-a="clear" title="모두 지우기">${SL.icon('trash')}</button>
    </div>`);
    const sync = () => {
      SL.$$('[data-t]', el).forEach(b => b.classList.toggle('on', layer.tool === b.dataset.t));
      SL.$$('[data-c]', el).forEach(b => b.classList.toggle('on', layer.color === b.dataset.c));
      SL.$('[data-a=vis]', el).innerHTML = SL.icon(layer.visible ? 'eye' : 'eyeoff');
    };
    el.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.t) layer.setTool(layer.tool === b.dataset.t ? null : b.dataset.t);
      if (b.dataset.c) { layer.color = b.dataset.c; if (!layer.tool) layer.setTool('line'); }
      if (b.dataset.a === 'vis') layer.setVisible(!layer.visible);
      if (b.dataset.a === 'undo') layer.undo();
      if (b.dataset.a === 'clear') layer.clear();
      sync();
    });
    sync(); root && root.appendChild(el);
    return el;
  };

  SL.DrawLayer = DrawLayer;
})(window.SL);

</script>
<script>
// 스윙 플레이어: 배속(0.25~1x) · 프레임 이동 · 스윙 궤적(백/다운 색 구분) · 스켈레톤 · 구간 점프 · 그리기
(function (SL) {
  const COL_BACK = '#40C8E0', COL_DOWN = '#FF453A', COL_SKEL = '#C6F432';

  class SwingPlayer {
    constructor(root, rec, url) {
      this.rec = rec; this.url = url; this.speed = 0.5;
      this.showTracer = true; this.showSkel = false;
      this.source = rec.frames && rec.frames.some(f => f.club) ? 'club' : 'hands';
      const ph = rec.phases;
      this.el = SL.h(`<div class="sp">
        <div class="sp-stagewrap"><div class="sp-stage">
          <video loop muted playsinline webkit-playsinline preload="auto"></video>
          <canvas class="ov"></canvas><canvas class="draw"></canvas>
          <div class="sp-hud"><span class="spd">0.5x</span><span class="phn" style="display:none"></span></div>
        </div></div>
        <div class="sp-ctrl">
          <div class="sp-time"><input type="range" min="0" max="1000" value="0" step="1"><span class="t">0:00.00</span></div>
          <div class="sp-main">
            <div class="transport">
              <button class="tbtn" data-a="prev" title="이전 프레임">${SL.icon('prev')}</button>
              <button class="tbtn play" data-a="play">${SL.icon('play')}</button>
              <button class="tbtn" data-a="next" title="다음 프레임">${SL.icon('next')}</button>
            </div>
            <div class="speeds">${[0.25, 0.5, 0.75, 1].map(s => `<button data-s="${s}" class="${s === 0.5 ? 'on' : ''}">${s}x</button>`).join('')}</div>
          </div>
          <div class="phases">${SL.JUMP_PHASES.map(k => `<button data-p="${k}" ${ph ? '' : 'disabled'}>${SL.phaseName(k)}<small>${ph ? ph.t[k].toFixed(2) + 's' : '-'}</small></button>`).join('')}</div>
          <div class="toolrow">
            <button class="tool acc on" data-a="tracer" ${rec.frames ? '' : 'disabled'}>${SL.icon('tracer')}궤적</button>
            <button class="tool" data-a="src" ${rec.frames ? '' : 'disabled'}>${this.source === 'club' ? '클럽헤드 β' : '손 경로'}</button>
            <button class="tool" data-a="skel" ${rec.frames ? '' : 'disabled'}>${SL.icon('skeleton')}관절</button>
            <span class="legend" style="margin-left:auto"><span><i style="background:${COL_BACK}"></i>백스윙</span><span><i style="background:${COL_DOWN}"></i>다운스윙</span></span>
          </div>
          <div class="draw-tools"></div>
        </div>
      </div>`);
      root.appendChild(this.el);
      this.v = SL.$('video', this.el); this.stage = SL.$('.sp-stage', this.el);
      this.ov = SL.$('canvas.ov', this.el); this.octx = this.ov.getContext('2d');
      this.layer = new SL.DrawLayer(SL.$('canvas.draw', this.el));
      SL.drawToolbar(this.layer, SL.$('.draw-tools', this.el));
      this.range = SL.$('input[type=range]', this.el); this.tEl = SL.$('.t', this.el);
      this.bind();
      this.ready = SL.loadVideo(this.v, url).then(() => { this.v.playbackRate = this.speed; this.fit(); });
      this.ro = new ResizeObserver(() => this.fit()); this.ro.observe(SL.$('.sp-stagewrap', this.el));
      const loop = () => { this.paint(); this.raf = requestAnimationFrame(loop); }; loop();
    }

    bind() {
      this.el.addEventListener('click', (e) => {
        const b = e.target.closest('button'); if (!b || b.disabled) return;
        if (b.dataset.s) this.setSpeed(+b.dataset.s);
        if (b.dataset.p) this.jump(b.dataset.p);
        const a = b.dataset.a;
        if (a === 'play') this.toggle();
        if (a === 'prev') this.step(-1);
        if (a === 'next') this.step(1);
        if (a === 'tracer') { this.showTracer = !this.showTracer; b.classList.toggle('on', this.showTracer); }
        if (a === 'skel') { this.showSkel = !this.showSkel; b.classList.toggle('on', this.showSkel); }
        if (a === 'src') {
          if (!this.rec.frames.some(f => f.club)) { SL.toast('클럽헤드를 찾지 못한 영상이에요 — 손 경로로 표시해요'); return; }
          this.source = this.source === 'club' ? 'hands' : 'club'; b.textContent = this.source === 'club' ? '클럽헤드 β' : '손 경로';
        }
      });
      this.stage.addEventListener('click', (e) => { if (!this.layer.tool && e.target.tagName !== 'BUTTON') this.toggle(); });
      this.range.addEventListener('input', () => { this.v.pause(); this.v.currentTime = this.range.value / 1000 * (this.v.duration || 0); });
      this.v.addEventListener('play', () => SL.$('[data-a=play]', this.el).innerHTML = SL.icon('pause'));
      this.v.addEventListener('pause', () => SL.$('[data-a=play]', this.el).innerHTML = SL.icon('play'));
    }

    fit() {
      const wrap = SL.$('.sp-stagewrap', this.el), vw = this.v.videoWidth || 9, vh = this.v.videoHeight || 16, ar = vw / vh;
      const W = wrap.clientWidth, maxH = Math.max(260, window.innerHeight * 0.56);
      let w = Math.min(W, maxH * ar), h = w / ar;
      this.stage.style.width = w + 'px'; this.stage.style.height = h + 'px';
      const dpr = window.devicePixelRatio || 1;
      this.ov.width = Math.round(w * dpr); this.ov.height = Math.round(h * dpr);
    }

    toggle() { if (this.v.paused) this.v.play().catch(() => {}); else this.v.pause(); }
    setSpeed(s) {
      this.speed = s; this.v.playbackRate = s;
      SL.$$('[data-s]', this.el).forEach(b => b.classList.toggle('on', +b.dataset.s === s));
      SL.$('.spd', this.el).textContent = s + 'x';
    }
    step(d) {
      this.v.pause();
      const fps = this.rec.fps || SL.settings.frameStep || 30;
      this.v.currentTime = SL.clamp(this.v.currentTime + d / fps, 0, Math.max(0, (this.v.duration || 0) - 0.001));
    }
    jump(k) {
      const ph = this.rec.phases; if (!ph) return;
      this.v.pause(); this.v.currentTime = ph.t[k] + 0.001;
      SL.$$('[data-p]', this.el).forEach(b => b.classList.toggle('on', b.dataset.p === k));
    }
    get idx() { const f = this.rec.frames; if (!f) return 0; return SL.clamp(Math.round(this.v.currentTime * (this.rec.fps || 30)), 0, f.length - 1); }

    paint() {
      const v = this.v, d = v.duration || 0;
      if (d) { if (document.activeElement !== this.range) this.range.value = Math.round(v.currentTime / d * 1000); this.tEl.textContent = `${SL.fmtTime(v.currentTime)} / ${SL.fmtTime(d)}`; }
      const ctx = this.octx, W = this.ov.width, H = this.ov.height, dpr = window.devicePixelRatio || 1;
      ctx.clearRect(0, 0, W, H);
      const fr = this.rec.frames; if (!fr || !fr.length) return;
      const i = this.idx, ph = this.rec.phases;
      // 현재 구간 표시
      const hud = SL.$('.phn', this.el);
      if (ph) {
        let cur = null; SL.PHASES.forEach(p => { if (i >= ph.idx[p.key]) cur = p.key; });
        if (i < ph.idx.address) cur = null;
        hud.style.display = cur ? '' : 'none'; if (cur) hud.textContent = SL.phaseName(cur);
      }
      const pt = (f) => {
        if (!f) return null;
        if (this.source === 'club' && f.club) return [f.club[0] * W, f.club[1] * H];
        if (this.source === 'hands' && f.lm) { const a = f.lm[15], b = f.lm[16]; return [(a[0] + b[0]) / 2 * W, (a[1] + b[1]) / 2 * H]; }
        return null;
      };
      if (this.showTracer) {
        const seg = (a, b, col) => {
          if (b < a) return;
          ctx.strokeStyle = col; ctx.lineWidth = 4 * dpr; ctx.lineJoin = ctx.lineCap = 'round';
          ctx.shadowColor = col; ctx.shadowBlur = 10 * dpr;
          ctx.beginPath(); let pen = false;
          for (let k = a; k <= b; k++) { const p = pt(fr[k]); if (!p) { pen = false; continue; } if (!pen) { ctx.moveTo(p[0], p[1]); pen = true; } else ctx.lineTo(p[0], p[1]); }
          ctx.stroke(); ctx.shadowBlur = 0;
        };
        if (ph) {
          seg(ph.idx.address, Math.min(i, ph.idx.top), COL_BACK);
          if (i > ph.idx.top) seg(ph.idx.top, Math.min(i, ph.idx.finish), COL_DOWN);
        } else seg(0, i, COL_DOWN);
        const p = pt(fr[i]);
        if (p) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p[0], p[1], 5 * dpr, 0, 7); ctx.fill(); }
      }
      if (this.showSkel && fr[i] && fr[i].lm) SwingPlayer.skeleton(ctx, fr[i].lm, W, H, dpr);
    }

    static skeleton(ctx, lm, W, H, dpr = 1, col = COL_SKEL) {
      ctx.strokeStyle = col; ctx.lineWidth = 2.5 * dpr; ctx.lineCap = 'round';
      SL.pose.EDGES.forEach(([a, b]) => {
        if (!lm[a] || !lm[b] || lm[a][2] < 0.3 || lm[b][2] < 0.3) return;
        ctx.beginPath(); ctx.moveTo(lm[a][0] * W, lm[a][1] * H); ctx.lineTo(lm[b][0] * W, lm[b][1] * H); ctx.stroke();
      });
      ctx.fillStyle = '#fff';
      [0, 11, 12, 13, 14, 15, 16, 23, 24, 25, 26, 27, 28].forEach(k => {
        if (!lm[k] || lm[k][2] < 0.3) return; ctx.beginPath(); ctx.arc(lm[k][0] * W, lm[k][1] * H, 3.2 * dpr, 0, 7); ctx.fill();
      });
    }

    destroy() { cancelAnimationFrame(this.raf); this.ro.disconnect(); this.layer.destroy(); this.v.pause(); this.v.removeAttribute('src'); this.v.load(); }
  }
  SL.SwingPlayer = SwingPlayer;
})(window.SL);

</script>

<script>
// 스윙 분석: 업로드 → 자동 분석 → 플레이어 + 템포
(function (SL) {
  const progressOverlay = (title) => {
    const o = SL.h(`<div class="overlay"><div class="box"><div class="spinner"></div>
      <div style="margin-top:18px;font-weight:700;font-size:17px" class="ot">${title}</div>
      <div class="bar"><i></i></div><div class="small muted op">준비 중…</div></div></div>`);
    document.body.appendChild(o);
    return {
      set(p, msg) { SL.$('.bar i', o).style.width = Math.round(p * 100) + '%'; if (msg) SL.$('.op', o).textContent = msg; },
      close() { o.remove(); },
    };
  };

  // 레코드 분석 실행 (업로드 직후 / 연습모드 클립 재분석 공용)
  SL.runAnalysis = async (rec) => {
    const ov = progressOverlay('스윙을 분석하고 있어요');
    const v = document.createElement('video');
    v.style.cssText = 'position:fixed;left:-9999px;width:2px;height:2px'; document.body.appendChild(v);
    const url = URL.createObjectURL(rec.blob);
    try {
      await SL.loadVideo(v, url);
      if (v.duration > 15) SL.toast('앞 15초까지만 분석해요. 스윙 구간만 잘라서 올리면 더 정확해요', 3500);
      ov.set(0.02, 'AI 자세 인식 모델 불러오는 중…');
      await SL.pose.get('full');
      await SL.analyzer.analyzeRecord(rec, v, p => ov.set(0.05 + p * 0.9, `프레임 분석 ${Math.round(p * 100)}%`));
      ov.set(0.97, '진단 정리 중…');
      const tt = rec.phases ? rec.phases.t.top : v.duration / 2;
      await SL.seek(v, tt); rec.thumb = SL.thumbOf(v) || rec.thumb;
      if (!rec.phases) SL.toast('스윙 구간을 찾지 못했어요 — 전신이 보이게 다시 촬영해 보세요', 3500);
    } catch (e) {
      console.error(e);
      if (!rec.thumb) { try { await SL.seek(v, Math.min(1, v.duration / 2)); rec.thumb = SL.thumbOf(v); } catch (_) {} }
      SL.toast('AI 모델을 불러오지 못했어요(인터넷 확인). 영상은 저장됐어요', 3500);
    } finally {
      await SL.db.put(rec);
      ov.close(); URL.revokeObjectURL(url); v.remove();
    }
    return rec;
  };

  function uploadView(view) {
    const st = { view: 'side', club: '드라이버', slow: 1 };
    view.innerHTML = `${SL.pageHead('스윙 업로드')}
      <label class="drop" for="file">${SL.icon('upload')}<b>스윙 영상 선택</b>
        <div class="small muted" style="margin-top:6px">어드레스~피니시가 담긴 3~10초 영상이 가장 좋아요</div></label>
      <input id="file" type="file" accept="video/*" hidden>
      <div class="field"><label class="lb">촬영 방향</label>
        <div class="seg" id="view"><button data-v="side" class="on">측면 (후방, DTL)</button><button data-v="front">정면 (Face-on)</button></div></div>
      <div class="field"><label class="lb">클럽</label><div class="chips" id="club">${SL.CLUBS.map((c, i) => `<button class="chip ${i ? '' : 'on'}" data-c="${c}">${c}</button>`).join('')}</div></div>
      <div class="field"><label class="lb">영상 종류 (템포 계산 보정)</label>
        <div class="seg" id="slow"><button data-s="1" class="on">일반 속도</button><button data-s="4">슬로모 120fps</button><button data-s="8">슬로모 240fps</button></div></div>
      <div class="card" style="margin-top:20px">
        <div style="font-weight:700;margin-bottom:6px">촬영 팁</div>
        <div class="tip"><i>1</i>삼각대로 고정 — 카메라가 움직이면 궤적이 틀어져요</div>
        <div class="tip"><i>2</i>머리부터 발끝, 클럽 끝까지 화면 안에</div>
        <div class="tip"><i>3</i>측면은 손 높이, 타겟 라인 뒤에서 촬영</div>
      </div>

})(window.SL);

<script>
// 스윙 비교: 나란히 / 겹쳐보기, 각각 재생·정지·배속, 구간 맞추기, 한 화면에 그리기
(function (SL) {
  SL.route('compare', async (view, params) => {
    const slots = { a: null, b: null }; // {rec, url}
    view.innerHTML = `${SL.pageHead('스윙 비교')}
      <div class="seg" id="mode" style="margin-bottom:12px"><button data-m="side" class="on">나란히 보기</button><button data-m="overlay">겹쳐 보기</button></div>
      <div class="cmp-area"><div class="cmp-grid">
        <div class="cmp-slot" data-k="a"></div><div class="cmp-slot" data-k="b"></div>
      </div><canvas class="draw"></canvas></div>
      <div id="opRow" class="row" style="margin-top:10px;display:none"><span class="small muted" style="width:70px">B 투명도</span><input type="range" id="op" min="10" max="90" value="50" style="flex:1"></div>
      <div class="cmp-ctrls"><div class="cmp-ctrl" data-k="a"></div><div class="cmp-ctrl" data-k="b"></div></div>
      <div class="row" style="margin-top:10px">
        <button class="btn sm" id="both" style="flex:1">${SL.icon('play')}동시 재생</button>
        <button class="btn sm" id="sync" style="flex:1">처음으로</button>
      </div>
      <div class="small muted" style="margin:14px 0 6px">구간 맞추기 (두 영상 모두 분석된 경우)</div>
      <div class="chips" id="align">${SL.JUMP_PHASES.map(k => `<button class="chip" data-p="${k}">${SL.phaseName(k)}</button>`).join('')}</div>
      <div id="tools"></div>`;
    const area = SL.$('.cmp-area', view), grid = SL.$('.cmp-grid', view);
    const layer = new SL.DrawLayer(SL.$('canvas.draw', area));
    SL.drawToolbar(layer, SL.$('#tools', view));
    const urls = [];

    const label = (k, rec) => `${k.toUpperCase()} · ${rec.source === 'pro' ? '프로' : '나'}${rec.club ? ' ' + rec.club : ''}`;
    const renderSlot = (k) => {
      const box = SL.$(`.cmp-slot[data-k=${k}]`, view), ctrl = SL.$(`.cmp-ctrl[data-k=${k}]`, view), s = slots[k];
      if (!s) {
        box.innerHTML = `<div class="pick"><span class="small muted">${k === 'a' ? '내 스윙' : '비교할 스윙 (프로 영상 등)'}</span>
          <button class="btn sm primary" data-pick="${k}">${SL.icon('plus')}영상 선택</button></div>`;
        ctrl.innerHTML = `<div class="small dim" style="text-align:center;padding:14px 0">${k.toUpperCase()} 영상 없음</div>`;
        return;
      }
      box.innerHTML = `<span class="lab">${SL.esc(label(k, s.rec))}</span><video class="${k}" loop muted playsinline webkit-playsinline preload="auto"></video>`;
      const v = SL.$('video', box); s.v = v;
      SL.loadVideo(v, s.url).then(() => { v.playbackRate = s.speed || 0.5; }).catch(e => SL.toast(e.message));
      ctrl.innerHTML = `<div class="r"><button class="tbtn" data-act="play">${SL.icon('play')}</button>
          <button class="tbtn" data-act="prev">${SL.icon('prev')}</button><button class="tbtn" data-act="next">${SL.icon('next')}</button>
          <button class="tbtn" data-pick="${k}" style="margin-left:auto">${SL.icon('flip')}</button></div>
        <input type="range" min="0" max="1000" value="0">
        <div class="mini-speeds">${[0.25, 0.5, 0.75, 1].map(x => `<button data-sp="${x}" class="${x === (s.speed || 0.5) ? 'on' : ''}">${x}x</button>`).join('')}</div>`;
      const rg = SL.$('input', ctrl);
      rg.addEventListener('input', () => { v.pause(); v.currentTime = rg.value / 1000 * (v.duration || 0); });
      v.addEventListener('timeupdate', () => { if (v.duration) rg.value = v.currentTime / v.duration * 1000; });
      v.addEventListener('play', () => SL.$('[data-act=play]', ctrl).innerHTML = SL.icon('pause'));
      v.addEventListener('pause', () => SL.$('[data-act=play]', ctrl).innerHTML = SL.icon('play'));
      ctrl.onclick = (e) => {
        const b = e.target.closest('button'); if (!b) return;
        if (b.dataset.act === 'play') v.paused ? v.play().catch(() => {}) : v.pause();
        if (b.dataset.act === 'prev' || b.dataset.act === 'next') { v.pause(); v.currentTime = SL.clamp(v.currentTime + (b.dataset.act === 'next' ? 1 : -1) / 30, 0, v.duration || 0); }
        if (b.dataset.sp) { s.speed = +b.dataset.sp; v.playbackRate = s.speed; SL.$$('[data-sp]', ctrl).forEach(x => x.classList.toggle('on', x === b)); }
      };
    };

    const setSlot = async (k, rec) => {
      const old = slots[k]; if (old) { old.v && old.v.pause(); }
      const url = URL.createObjectURL(rec.blob); urls.push(url);
      slots[k] = { rec, url, speed: 0.5 }; renderSlot(k);
    };

    const pick = async (k) => {
      const list = (await SL.db.all()).filter(r => r.blob);
      SL.sheet(`<h3>${k.toUpperCase()} 영상 선택</h3>
        <label class="btn primary block" for="pf">${SL.icon('upload')}새 영상 업로드 (프로 스윙 등)</label>

        <div class="small muted" style="margin:16px 0 4px">저장된 스윙</div>
        ${list.length ? list.map(r => `<div class="rec" data-id="${r.id}" style="cursor:pointer">

          <div class="meta"><b>${r.source === 'pro' ? '프로 · ' : ''}${SL.esc(r.club || r.title || '스윙')}</b><span>${SL.fmtDate(r.createdAt)}</span></div></div>`).join('') : '<div class="empty">저장된 영상이 없어요</div>'}`,
        (sh, close) => {

            await SL.db.put(rec); setSlot(k, rec);
            SL.toast(k === 'b' ? '프로 영상으로 저장했어요 (기록 > 프로)' : '영상을 저장했어요');
          });
        });
    };

    view.addEventListener('click', e => { const b = e.target.closest('[data-pick]'); if (b) pick(b.dataset.pick); });
    SL.$('#mode', view).addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      SL.$$('#mode button', view).forEach(x => x.classList.toggle('on', x === b));
      const ov = b.dataset.m === 'overlay';
